<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Application Black Hole — Card Grid</title>
<style>
/* tokens:begin */
/* ============================================================================
   journey-tokens.css — the single source of truth for every journey rendering.

   Tier 1  brand seed      ~10 values. The only thing a user/brand ever changes.
   Tier 2  semantic        derived from Tier 1. Renderings consume THESE.
   Tier 3  component       declared locally inside each rendering, from Tier 2.

   Rule for renderings: zero literal colors. If you type a hex, it belongs here.
   Themes: base = light. Dark re-derives (never inverts) via prefers-color-scheme
   and [data-theme], so a manual toggle wins in both directions.

   OVERRIDING TIER 1 (brand themes, paper artifacts): the dark blocks below are
   selected by :root:not([data-theme="light"]) and :root[data-theme="dark"],
   both of which out-specify a bare :root. So an artifact that reseeds Tier 1
   must also pin its theme on the element:

       <html data-theme="light">   ← now the dark blocks cannot match, and a
                                     later :root{...} override wins on order

   Reseeding at :root without pinning a theme silently does nothing for readers
   whose system is set to dark. See renderings/food-delivery--swimlane-themed
   (a brand reseed) and renderings/job-application--storyboard (a paper reseed).
   ========================================================================= */

/* ── Tier 1 · brand seed ───────────────────────────────────────────────── */
:root{
  --brand-primary:    oklch(70% 0.148 52);      /* chrome, accent, selection   */
  --brand-secondary:  oklch(63% 0.115 248);     /* second categorical hue      */
  --brand-surface:    oklch(98.6% 0.006 80);    /* page ground                 */
  --brand-text:       oklch(21% 0.014 62);      /* body ink                    */
  --brand-positive:   oklch(64% 0.118 158);     /* semantic good               */
  --brand-negative:   oklch(58% 0.168 25);      /* semantic bad                */
  --brand-machine:    oklch(60% 0.096 285);     /* automated / no-human paths  */
  --brand-on-primary: oklch(22% 0.014 70);      /* text that sits ON the primary */
  --brand-attention:  oklch(72% 0.152 62);      /* momentOfTruth — NOT the brand:
                                                   a marker that repaints itself
                                                   when the logo changes is not a
                                                   marker (guide § colour) */
  /* categorical seed — Okabe-Ito, distinguishable under all three common
     colour-vision deficiencies. Independent of brand on purpose (see
     html-rendering-guide § accessibility); override only if the brand's own
     categorical palette has been checked for the same. */
  --brand-cat-1:      oklch(56% 0.108 248);     /* blue            */
  --brand-cat-2:      oklch(62% 0.155 42);      /* vermillion      */
  --brand-cat-3:      oklch(60% 0.098 168);     /* bluish green    */
  --brand-cat-4:      oklch(72% 0.145 78);      /* orange          */
  --brand-cat-5:      oklch(56% 0.112 340);     /* reddish purple  */
  --brand-font:       "Söhne","Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --brand-font-mono:  ui-monospace,"SF Mono","Berkeley Mono",Menlo,Consolas,monospace;
  --brand-radius:     3px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-primary:   oklch(76% 0.138 55);
    --brand-secondary: oklch(70% 0.105 248);
    --brand-surface:   oklch(17.5% 0.008 66);
    --brand-text:      oklch(94% 0.008 80);
    --brand-positive:  oklch(72% 0.108 158);
    --brand-negative:  oklch(67% 0.150 26);
    --brand-machine:   oklch(70% 0.088 285);
    --brand-attention: oklch(78% 0.140 64);
    --brand-cat-1:     oklch(70% 0.098 248);
    --brand-cat-2:     oklch(72% 0.140 42);
    --brand-cat-3:     oklch(70% 0.090 168);
    --brand-cat-4:     oklch(78% 0.130 78);
    --brand-cat-5:     oklch(68% 0.102 340);
  }
}
:root[data-theme="dark"]{
  --brand-primary:   oklch(76% 0.138 55);
  --brand-secondary: oklch(70% 0.105 248);
  --brand-surface:   oklch(17.5% 0.008 66);
  --brand-text:      oklch(94% 0.008 80);
  --brand-positive:  oklch(72% 0.108 158);
  --brand-negative:  oklch(67% 0.150 26);
  --brand-machine:   oklch(70% 0.088 285);
  --brand-attention: oklch(78% 0.140 64);
  --brand-cat-1:     oklch(70% 0.098 248);
  --brand-cat-2:     oklch(72% 0.140 42);
  --brand-cat-3:     oklch(70% 0.090 168);
  --brand-cat-4:     oklch(78% 0.130 78);
  --brand-cat-5:     oklch(68% 0.102 340);
}

/* ── Tier 2 · semantic ─────────────────────────────────────────────────── */
:root{
  /* ground & elevation — dark re-derives by mixing toward ink, not by inverting */
  --bg:          var(--brand-surface);
  --surface-1:   color-mix(in oklab, var(--brand-surface) 97%, var(--brand-text));
  --surface-2:   color-mix(in oklab, var(--brand-surface) 93%, var(--brand-text));
  --surface-3:   color-mix(in oklab, var(--brand-surface) 88%, var(--brand-text));

  /* ink */
  --ink:         var(--brand-text);
  --ink-muted:   color-mix(in oklab, var(--brand-text) 58%, var(--brand-surface));
  --ink-faint:   color-mix(in oklab, var(--brand-text) 36%, var(--brand-surface));
  --ink-ghost:   color-mix(in oklab, var(--brand-text) 20%, var(--brand-surface));

  /* rules */
  --line:        color-mix(in oklab, var(--brand-text) 16%, var(--brand-surface));
  --line-soft:   color-mix(in oklab, var(--brand-text) 9%,  var(--brand-surface));
  --line-strong: color-mix(in oklab, var(--brand-text) 34%, var(--brand-surface));

  /* accent */
  --accent:       var(--brand-primary);
  --accent-soft:  color-mix(in oklab, var(--brand-primary) 16%, var(--brand-surface));
  --accent-line:  color-mix(in oklab, var(--brand-primary) 55%, var(--brand-surface));
  --accent-ink:   color-mix(in oklab, var(--brand-primary) 18%, var(--brand-text));
  --ink-on-accent: var(--brand-on-primary);

  /* emotion valence — diverging, 5 stops. Deliberately held one step back from
     full strength: valence is the *field*, markers are annotations laid on top of
     it, and a marker that reads as just another data point has failed. NEVER the
     sole encoding either — always pair with position, a numeral, or a glyph
     (see html-rendering-guide § accessibility). */
  --valence-n2:  color-mix(in oklab, var(--brand-negative) 82%, var(--surface-2));
  --valence-n1:  color-mix(in oklab, var(--brand-negative) 52%, var(--surface-2));
  --valence-0:   var(--ink-ghost);
  --valence-p1:  color-mix(in oklab, var(--brand-positive) 52%, var(--surface-2));
  --valence-p2:  color-mix(in oklab, var(--brand-positive) 82%, var(--surface-2));

  /* markers */
  --marker-critical:    var(--brand-attention);   /* momentOfTruth   */
  --marker-fail:        var(--brand-negative);    /* failureMode     */
  --marker-opportunity: var(--brand-positive);    /* opportunity     */
  --marker-machine:     var(--brand-machine);     /* automation      */
  --marker-pain:        color-mix(in oklab, var(--brand-negative) 62%, var(--brand-primary)); /* painPoint */

  /* Two colours that pair with *data*, not with the page, so they must NOT flip
     with the theme: text sitting on a saturated fill, and the colour a shadow is
     cast in. Inverting either is the classic dark-mode bug. */
  --ink-on-fill: oklch(22% 0.014 70);
  --shadow-ink:  oklch(12% 0.010 60);

  /* actor kinds (categorical — limit to 4, per the guide's 6–8 hue ceiling) */
  --actor-primary:   var(--brand-primary);
  --actor-system:    var(--brand-machine);
  --actor-backstage: var(--brand-secondary);
  --actor-none:      var(--ink-faint);

  /* categorical — unordered groups: milestones, lanes, channels. Never use
     these for anything ordered; lightness (the ramp below) encodes magnitude. */
  --cat-1: var(--brand-cat-1);
  --cat-2: var(--brand-cat-2);
  --cat-3: var(--brand-cat-3);
  --cat-4: var(--brand-cat-4);
  --cat-5: var(--brand-cat-5);
  --cat-1-soft: color-mix(in oklab, var(--brand-cat-1) 16%, var(--bg));
  --cat-2-soft: color-mix(in oklab, var(--brand-cat-2) 16%, var(--bg));
  --cat-3-soft: color-mix(in oklab, var(--brand-cat-3) 16%, var(--bg));
  --cat-4-soft: color-mix(in oklab, var(--brand-cat-4) 16%, var(--bg));
  --cat-5-soft: color-mix(in oklab, var(--brand-cat-5) 16%, var(--bg));

  /* service layers */
  --layer-customer-bg:  color-mix(in oklab, var(--brand-primary) 9%, var(--bg));
  --layer-customer-ln:  var(--accent-line);
  --layer-backstage-bg: var(--surface-2);
  --layer-backstage-ln: var(--line);
  --layer-support-bg:   var(--surface-1);
  --layer-support-ln:   var(--line-soft);

  /* sequential ramp — ordered magnitude (density, duration, count). Single hue,
     stepped in oklab so equal numeric steps read as equal perceptual steps. */
  --ramp-0: var(--surface-1);
  --ramp-1: color-mix(in oklab, var(--brand-primary) 18%, var(--surface-1));
  --ramp-2: color-mix(in oklab, var(--brand-primary) 36%, var(--surface-1));
  --ramp-3: color-mix(in oklab, var(--brand-primary) 56%, var(--surface-1));
  --ramp-4: color-mix(in oklab, var(--brand-primary) 78%, var(--surface-1));
  --ramp-5: var(--brand-primary);

  /* provenance — the skill's own metadata, so it gets first-class tokens */
  --prov-model:  var(--ink-ghost);                /* model-authored (default)  */
  --prov-user:   var(--brand-primary);            /* user-modified             */
  --prov-source: var(--brand-secondary);          /* source-backed             */
  --prov-auto:   var(--brand-machine);            /* auto-composite            */

  /* priority */
  --prio-must:   var(--brand-negative);
  --prio-should: var(--brand-primary);
  --prio-nice:   var(--ink-faint);

  /* type — fluid modular scale, ratio 1.2 */
  --font:      var(--brand-font);
  --font-mono: var(--brand-font-mono);
  --step--2: clamp(0.60rem, 0.58rem + 0.10vw, 0.66rem);
  --step--1: clamp(0.72rem, 0.69rem + 0.14vw, 0.80rem);
  --step-0:  clamp(0.86rem, 0.82rem + 0.18vw, 0.95rem);
  --step-1:  clamp(1.03rem, 0.97rem + 0.28vw, 1.19rem);
  --step-2:  clamp(1.24rem, 1.14rem + 0.48vw, 1.55rem);
  --step-3:  clamp(1.60rem, 1.40rem + 1.00vw, 2.40rem);
  --step-4:  clamp(2.10rem, 1.70rem + 2.00vw, 4.00rem);

  /* space — deliberately uneven, so rhythm is possible */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 13px; --sp-4: 21px;
  --sp-5: 34px; --sp-6: 55px; --sp-7: 89px;

  --radius: var(--brand-radius);
  --dur-fast: 140ms; --dur: 260ms; --dur-slow: 620ms;
  --ease: cubic-bezier(.22,.61,.36,1);          /* ease-out-quart, no bounce */
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
}
/* tokens:end */
/* theme:begin */
/* theme:end */

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:44px 24px 80px}

  header.top{margin-bottom:34px}
  .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
          margin-bottom:10px}
  h1{font-size:clamp(1.6rem,3.4vw,2.1rem);line-height:1.12;letter-spacing:-.02em;margin:0 0 10px}
  .lede{color:var(--ink-muted);max-width:62ch;margin:0}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
            margin:26px 0 8px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .controls span.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
                     color:var(--ink-faint);margin-right:2px}
  .controls button{font:500 12px/1 var(--font);color:var(--ink-muted);cursor:pointer;
                   background:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;
                   transition:color .12s,border-color .12s,background .12s}
  .controls button:hover{color:var(--ink);border-color:var(--line-strong)}
  .controls button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
                                        background:var(--accent-soft)}
  .controls .spacer{flex:1}
  .count{font-size:12px;color:var(--ink-faint);font-family:var(--font-mono)}

  .mstone{margin:38px 0 16px}
  .mstone h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin:0 0 4px;
             color:var(--accent)}
  .mstone p{margin:0;color:var(--ink-muted);font-size:13.5px;max-width:70ch}

  /* the card is a stack, not a grid of equal boxes: a journey has an order */
  .card{position:relative;border:1px solid var(--line);border-left:3px solid var(--v);
        border-radius:8px;background:var(--surface-1);margin-bottom:10px;
        transition:border-color .14s,background .14s}
  .card:hover{background:var(--surface-2)}
  .card[open]{background:var(--surface-2);border-color:var(--line-strong)}
  .card summary{list-style:none;cursor:pointer;padding:15px 18px;display:grid;
                grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline}
  .card summary::-webkit-details-marker{display:none}
  .card summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}

  .idx{font-family:var(--font-mono);font-size:11px;color:var(--ink-ghost);
       font-variant-numeric:tabular-nums}
  .ttl{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .sid{font-family:var(--font-mono);font-size:10px;color:var(--ink-ghost);display:block;
       margin-top:2px;font-weight:400;letter-spacing:0}
  .marks{display:flex;gap:6px;align-items:center;font-size:12px}
  .mk{width:16px;height:16px;display:grid;place-items:center;border-radius:50%;font-size:9px}
  .mk.truth{color:var(--marker-critical);border:1px solid var(--marker-critical)}
  .mk.fail{color:var(--marker-fail);border:1px solid var(--marker-fail)}
  .mk.opp{color:var(--marker-opportunity);border:1px solid var(--marker-opportunity)}
  .val{font-family:var(--font-mono);font-size:11px;color:var(--v);font-variant-numeric:tabular-nums}

  .desc{grid-column:2/-1;color:var(--ink-muted);font-size:13.5px;margin:0}
  .meta{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .pill{font-size:10.5px;padding:2.5px 8px;border-radius:999px;background:var(--surface-3);
        color:var(--ink-muted);white-space:nowrap}
  .pill.persona{background:var(--accent-soft);color:var(--accent-ink)}
  .pill.persona.sys{background:color-mix(in oklab,var(--marker-machine) 16%,var(--bg));
                    color:color-mix(in oklab,var(--marker-machine) 70%,var(--ink))}
  .pill.clock::before{content:"◷ ";color:var(--ink-faint)}
  .pill.emo{background:none;border:1px solid var(--v);color:var(--v)}

  .body{padding:2px 18px 20px 18px;border-top:1px solid var(--line-soft);margin-top:2px}
  .grp{margin-top:16px}
  .grp h3{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
          margin:0 0 8px;font-weight:600}
  .f{display:grid;grid-template-columns:minmax(120px,150px) 1fr;gap:4px 16px;
     padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .f:last-child{border-bottom:0}
  .f dt{color:var(--ink-faint);font-family:var(--font-mono);font-size:11px;padding-top:2px}
  .f dd{margin:0;color:var(--ink)}
  .f dd ul{margin:0;padding-left:16px}
  .f.pain dd{border-left:2px solid var(--marker-pain);padding-left:10px;margin-left:-2px}
  .f.opp dd{border-left:2px dashed var(--marker-opportunity);padding-left:10px;margin-left:-2px}
  .f.risk dd{border-left:2px solid var(--marker-fail);padding-left:10px;margin-left:-2px}
  .f.truth dd{border-left:2px solid var(--marker-critical);padding-left:10px;margin-left:-2px}

  .flow{margin-top:14px;font-size:12px;font-family:var(--font-mono);color:var(--ink-muted);
        display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .flow a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  .flow a:hover{border-bottom-color:var(--accent)}
  .flow .exit{color:var(--marker-fail)}

  .empty{padding:40px 4px;color:var(--ink-faint);font-size:13.5px}
  .foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
        font-size:12px;color:var(--ink-faint);font-family:var(--font-mono)}
  @media(max-width:640px){
    .card summary{grid-template-columns:auto 1fr;gap:4px 10px}
    .marks{grid-column:2/-1;margin-top:6px}
    .f{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">Rendering · Card grid</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="controls" id="controls">
    <span class="lbl">Persona</span>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
  </div>

  <main id="stack"></main>

  <p class="foot" id="foot"></p>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = s => { const v = parseInt(s.fields.emotionValence, 10); return Number.isFinite(v) ? v : null; };
const VTOK = { "-2":"--valence-n2","-1":"--valence-n1","0":"--valence-0","1":"--valence-p1","2":"--valence-p2" };
const PTYPE = Object.fromEntries(JOURNEY.personas.map(p => [p.name, p.type]));

// which fields have already been shown in the collapsed head, so the expanded
// body does not repeat them
const HEAD = new Set(["description","persona","emotion","emotionValence","emotionIntensity",
                      "duration","waitTime","channel","momentOfTruth","failureMode","opportunity"]);
const GROUPS = [
  ["The moment",  ["momentOfTruth","thinking","decision","expectation"]],
  ["Friction",    ["painPoint","effort","cognitiveLoad","accessibilityBarrier","literacyRequirement",
                   "inclusionConsideration"]],
  ["What breaks", ["failureMode","failureProbability","failureImpact","risk","recoveryPath",
                   "workaround","bottleneck"]],
  ["Behind it",   ["systems","backstageAction","backstageStaff","handoff","automation","dataFlow",
                   "policy","lineOfVisibility","orchestration","notification","valueExchange"]],
  ["Design",      ["opportunity","priority"]],
];
const LABEL = f => f.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase());

function fieldValue(v) {
  if (Array.isArray(v)) return "<ul>" + v.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
  if (v && typeof v === "object")
    return "<ul>" + Object.entries(v).map(([k, x]) => "<li>" + esc(k) + ": " + esc(x) + "</li>").join("") + "</ul>";
  return esc(v);
}

function flowLine(s) {
  const bits = [];
  const nx = s.fields.next;
  const push = (label, target) => {
    const id = String(target).replace(/^→\s*/, "").trim();
    const known = id.replace(/[^a-z0-9-]/gi, "");
    bits.push((label ? esc(label) + " → " : "→ ") +
      (document.getElementById("s-" + known) || STEPS.some(x => x.id === known)
        ? '<a href="#s-' + known + '">' + esc(id) + "</a>" : esc(id)));
  };
  if (typeof nx === "string") push("", nx);
  else if (nx && typeof nx === "object") Object.entries(nx).forEach(([k, v]) => push(k, v));
  if (s.fields.parallelPath) bits.push("⇉ " + esc(s.fields.parallelPath));
  if (s.fields.exitPoint) bits.push('<span class="exit">▪ exit point</span>');
  return bits.length ? '<div class="flow">' + bits.join("<span>·</span>") + "</div>" : "";
}

const STEPS = JOURNEY.milestones.flatMap(m => m.steps.map(s => ({ ...s, _m: m })));

function card(s) {
  const v = val(s), tok = v === null ? "--ink-ghost" : VTOK[String(v)];
  const f = s.fields;
  const personas = (f.persona || []).map(p =>
    '<span class="pill persona' + (PTYPE[p] && PTYPE[p] !== "primary" ? " sys" : "") + '">' + esc(p) + "</span>").join("");
  const time = f.duration || f.waitTime;
  const marks = [
    f.momentOfTruth ? '<span class="mk truth" title="Moment of truth">◆</span>' : "",
    f.failureMode   ? '<span class="mk fail"  title="Failure mode">⚑</span>' : "",
    f.opportunity   ? '<span class="mk opp"   title="Opportunity">✦</span>' : "",
    v === null ? "" : '<span class="val">' + (v > 0 ? "+" : "") + v + "</span>",
  ].join("");

  const groups = GROUPS.map(([name, fields]) => {
    const rows = fields.filter(k => f[k] !== undefined && !(HEAD.has(k) && k !== "momentOfTruth" &&
                                 k !== "failureMode" && k !== "opportunity" && k !== "painPoint"))
      .map(k => {
        const cls = k === "painPoint" ? " pain" : k === "opportunity" ? " opp"
                  : k === "momentOfTruth" ? " truth"
                  : /^(failure|risk|bottleneck)/.test(k) ? " risk" : "";
        return '<div class="f' + cls + '"><dt>' + esc(LABEL(k)) + "</dt><dd>" + fieldValue(f[k]) + "</dd></div>";
      }).join("");
    return rows ? '<div class="grp"><h3>' + name + "</h3><dl>" + rows + "</dl></div>" : "";
  }).join("");

  return '<details class="card" id="s-' + esc(s.id) + '" style="--v:var(' + tok + ')" ' +
         'data-personas="' + esc((f.persona || []).join("|")) + '">' +
    "<summary>" +
      '<span class="idx">' + String(s.index + 1).padStart(2, "0") + "</span>" +
      '<span><span class="ttl">' + esc(LABEL(s.id.replace(/-/g, " "))) +
        '<span class="sid">' + esc(s.id) + "</span></span></span>" +
      '<span class="marks">' + marks + "</span>" +
      '<p class="desc">' + esc(f.description || "") + "</p>" +
      '<span class="meta">' + personas +
        (f.emotion ? '<span class="pill emo">' + esc(f.emotion) + "</span>" : "") +
        (time ? '<span class="pill clock">' + esc(time) + "</span>" : "") +
        (f.channel ? '<span class="pill">' + esc(f.channel) + "</span>" : "") +
      "</span>" +
    "</summary>" +
    '<div class="body">' + groups + flowLine(s) + "</div></details>";
}

function render(persona) {
  const root = $("stack");
  root.innerHTML = JOURNEY.milestones.map(m => {
    const steps = m.steps.filter(s => !persona || (s.fields.persona || []).includes(persona));
    if (!steps.length) return "";
    return '<section class="mstone"><h2>' + esc(m.fields.title || m.id) + "</h2>" +
           "<p>" + esc(m.fields.description || "") + "</p></section>" + steps.map(card).join("");
  }).join("") || '<p class="empty">No steps involve that persona.</p>';
  const shown = JOURNEY.milestones.flatMap(m => m.steps)
    .filter(s => !persona || (s.fields.persona || []).includes(persona)).length;
  $("count").textContent = shown + " of " + JOURNEY.stepCount + " steps";
}

$("title").textContent = "The Application Black Hole";
$("lede").textContent = JOURNEY.journey +
  " — every step as a card, in order, grouped by milestone. Open any card for the full record.";
$("foot").textContent = "source · " + JOURNEY.source + " · " + JOURNEY.stepCount +
  " steps · " + JOURNEY.milestones.length + " milestones";

const names = ["All", ...JOURNEY.personas.map(p => p.name)];
$("controls").insertBefore(
  Object.assign(document.createElement("span"), {
    innerHTML: names.map((n, i) =>
      '<button type="button" data-persona="' + (i ? n : "") + '" aria-pressed="' + (i === 0) + '">' +
      n + "</button>").join(""),
    style: "display:flex;flex-wrap:wrap;gap:8px",
  }), $("controls").querySelector(".spacer"));

$("controls").addEventListener("click", e => {
  const b = e.target.closest("button[data-persona]");
  if (!b) return;
  $("controls").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render(b.dataset.persona);
});

render("");
</script>

<script>
/* ==========================================================================
   switcher.js — the theme control every rendering carries.

   A rendering ships dark. What it does NOT ship is a fixed identity: paper,
   brand and light are one click away, because that is the honest demonstration
   of a token layer — the reader re-seeds Tier 1 and watches the whole palette
   re-derive, rather than being shown four files that someone styled four times.

   Mechanism: presets are written as INLINE custom properties on <html>. Element
   style beats every stylesheet rule, so this sidesteps the specificity fight
   between a :root override and the token file's dark blocks entirely (see
   journey-tokens.css § OVERRIDING TIER 1). data-theme still selects which of
   the shipped palettes derives underneath.
   ========================================================================== */
(function () {
  var root = document.documentElement;

  var PRESETS = {
    dark:  { theme: "dark",  seeds: null, label: "Dark" },
    light: { theme: "light", seeds: null, label: "Light" },
    paper: { theme: "light", label: "Paper", seeds: {
      "--brand-surface":  "oklch(96.5% 0.011 85)",
      "--brand-text":     "oklch(19% 0.006 80)",
      "--brand-primary":  "oklch(58% 0.098 62)",
      "--brand-negative": "oklch(50% 0.155 28)"
    }},
    brand: { theme: "dark", label: "Brand", seeds: {
      "--brand-primary":    "#A97BF0",
      "--brand-surface":    "#14101c",
      "--brand-text":       "#ece8f5",
      "--brand-on-primary": "#14101c"
    }}
  };
  var SEED_KEYS = ["--brand-surface","--brand-text","--brand-primary","--brand-negative",
                   "--brand-secondary","--brand-positive","--brand-on-primary","--brand-attention"];

  function apply(name) {
    var p = PRESETS[name] || PRESETS.dark;
    SEED_KEYS.forEach(function (k) { root.style.removeProperty(k); });
    if (p.seeds) Object.keys(p.seeds).forEach(function (k) { root.style.setProperty(k, p.seeds[k]); });
    root.setAttribute("data-theme", p.theme);
    root.setAttribute("data-preset", name);
    try { sessionStorage.setItem("journey-theme", name); } catch (e) {}
    [].forEach.call(box.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.preset === name));
    });
  }

  var box = document.createElement("div");
  box.className = "journey-theme-switch";
  box.setAttribute("role", "group");
  box.setAttribute("aria-label", "Theme");
  box.innerHTML =
    '<style>' +
    '.journey-theme-switch{position:fixed;top:14px;right:14px;z-index:9999;display:flex;gap:2px;' +
      'padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-1);' +
      'font:500 10px/1 var(--font);letter-spacing:.09em;' +
      'text-transform:uppercase;box-shadow:0 2px 10px color-mix(in oklab,var(--shadow-ink) 22%,transparent)}' +
    '.journey-theme-switch button{border:0;background:none;color:var(--ink-muted);cursor:pointer;' +
      'padding:6px 10px;border-radius:999px;font:inherit;transition:color .12s,background .12s}' +
    '.journey-theme-switch button:hover{color:var(--ink)}' +
    '.journey-theme-switch button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}' +
    '.journey-theme-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}' +
    '@media print{.journey-theme-switch{display:none}}' +
    '</style>' +
    Object.keys(PRESETS).map(function (k) {
      return '<button type="button" data-preset="' + k + '" aria-pressed="false">' +
             PRESETS[k].label + '</button>';
    }).join("");

  box.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-preset]");
    if (b) apply(b.dataset.preset);
  });

  function mount() {
    document.body.appendChild(box);
    var saved;
    try { saved = sessionStorage.getItem("journey-theme"); } catch (e) {}
    apply(saved && PRESETS[saved] ? saved : (root.getAttribute("data-preset") || "dark"));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();
</script>
