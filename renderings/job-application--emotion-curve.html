<style>
/* tokens:begin */
/* ============================================================================
   journey-tokens.css — the single source of truth for every journey rendering.

   Tier 1  brand seed      ~10 values. The only thing a user/brand ever changes.
   Tier 2  semantic        derived from Tier 1. Renderings consume THESE.
   Tier 3  component       declared locally inside each rendering, from Tier 2.

   Rule for renderings: zero literal colors. If you type a hex, it belongs here.
   Themes: base = light. Dark re-derives (never inverts) via prefers-color-scheme
   and [data-theme], so a manual toggle wins in both directions.

   OVERRIDING TIER 1 (brand themes, paper artifacts): the dark blocks below are
   selected by :root:not([data-theme="light"]) and :root[data-theme="dark"],
   both of which out-specify a bare :root. So an artifact that reseeds Tier 1
   must also pin its theme on the element:

       <html data-theme="light">   ← now the dark blocks cannot match, and a
                                     later :root{...} override wins on order

   Reseeding at :root without pinning a theme silently does nothing for readers
   whose system is set to dark. See renderings/food-delivery--swimlane-themed
   (a brand reseed) and renderings/job-application--storyboard (a paper reseed).
   ========================================================================= */

/* ── Tier 1 · brand seed ───────────────────────────────────────────────── */
:root{
  --brand-primary:    oklch(70% 0.148 52);      /* chrome, accent, selection   */
  --brand-secondary:  oklch(63% 0.115 248);     /* second categorical hue      */
  --brand-surface:    oklch(98.6% 0.006 80);    /* page ground                 */
  --brand-text:       oklch(21% 0.014 62);      /* body ink                    */
  --brand-positive:   oklch(64% 0.118 158);     /* semantic good               */
  --brand-negative:   oklch(58% 0.168 25);      /* semantic bad                */
  --brand-machine:    oklch(60% 0.096 285);     /* automated / no-human paths  */
  --brand-on-primary: oklch(22% 0.014 70);      /* text that sits ON the primary */
  --brand-attention:  oklch(72% 0.152 62);      /* momentOfTruth — NOT the brand:
                                                   a marker that repaints itself
                                                   when the logo changes is not a
                                                   marker (guide § colour) */
  /* categorical seed — Okabe-Ito, distinguishable under all three common
     colour-vision deficiencies. Independent of brand on purpose (see
     html-rendering-guide § accessibility); override only if the brand's own
     categorical palette has been checked for the same. */
  --brand-cat-1:      oklch(56% 0.108 248);     /* blue            */
  --brand-cat-2:      oklch(62% 0.155 42);      /* vermillion      */
  --brand-cat-3:      oklch(60% 0.098 168);     /* bluish green    */
  --brand-cat-4:      oklch(72% 0.145 78);      /* orange          */
  --brand-cat-5:      oklch(56% 0.112 340);     /* reddish purple  */
  --brand-font:       "Söhne","Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --brand-font-mono:  ui-monospace,"SF Mono","Berkeley Mono",Menlo,Consolas,monospace;
  --brand-radius:     3px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-primary:   oklch(76% 0.138 55);
    --brand-secondary: oklch(70% 0.105 248);
    --brand-surface:   oklch(17.5% 0.008 66);
    --brand-text:      oklch(94% 0.008 80);
    --brand-positive:  oklch(72% 0.108 158);
    --brand-negative:  oklch(67% 0.150 26);
    --brand-machine:   oklch(70% 0.088 285);
    --brand-attention: oklch(78% 0.140 64);
    --brand-cat-1:     oklch(70% 0.098 248);
    --brand-cat-2:     oklch(72% 0.140 42);
    --brand-cat-3:     oklch(70% 0.090 168);
    --brand-cat-4:     oklch(78% 0.130 78);
    --brand-cat-5:     oklch(68% 0.102 340);
  }
}
:root[data-theme="dark"]{
  --brand-primary:   oklch(76% 0.138 55);
  --brand-secondary: oklch(70% 0.105 248);
  --brand-surface:   oklch(17.5% 0.008 66);
  --brand-text:      oklch(94% 0.008 80);
  --brand-positive:  oklch(72% 0.108 158);
  --brand-negative:  oklch(67% 0.150 26);
  --brand-machine:   oklch(70% 0.088 285);
  --brand-attention: oklch(78% 0.140 64);
  --brand-cat-1:     oklch(70% 0.098 248);
  --brand-cat-2:     oklch(72% 0.140 42);
  --brand-cat-3:     oklch(70% 0.090 168);
  --brand-cat-4:     oklch(78% 0.130 78);
  --brand-cat-5:     oklch(68% 0.102 340);
}

/* ── Tier 2 · semantic ─────────────────────────────────────────────────── */
:root{
  /* ground & elevation — dark re-derives by mixing toward ink, not by inverting */
  --bg:          var(--brand-surface);
  --surface-1:   color-mix(in oklab, var(--brand-surface) 97%, var(--brand-text));
  --surface-2:   color-mix(in oklab, var(--brand-surface) 93%, var(--brand-text));
  --surface-3:   color-mix(in oklab, var(--brand-surface) 88%, var(--brand-text));

  /* ink */
  --ink:         var(--brand-text);
  --ink-muted:   color-mix(in oklab, var(--brand-text) 58%, var(--brand-surface));
  --ink-faint:   color-mix(in oklab, var(--brand-text) 36%, var(--brand-surface));
  --ink-ghost:   color-mix(in oklab, var(--brand-text) 20%, var(--brand-surface));

  /* rules */
  --line:        color-mix(in oklab, var(--brand-text) 16%, var(--brand-surface));
  --line-soft:   color-mix(in oklab, var(--brand-text) 9%,  var(--brand-surface));
  --line-strong: color-mix(in oklab, var(--brand-text) 34%, var(--brand-surface));

  /* accent */
  --accent:       var(--brand-primary);
  --accent-soft:  color-mix(in oklab, var(--brand-primary) 16%, var(--brand-surface));
  --accent-line:  color-mix(in oklab, var(--brand-primary) 55%, var(--brand-surface));
  --accent-ink:   color-mix(in oklab, var(--brand-primary) 18%, var(--brand-text));
  --ink-on-accent: var(--brand-on-primary);

  /* emotion valence — diverging, 5 stops. Deliberately held one step back from
     full strength: valence is the *field*, markers are annotations laid on top of
     it, and a marker that reads as just another data point has failed. NEVER the
     sole encoding either — always pair with position, a numeral, or a glyph
     (see html-rendering-guide § accessibility). */
  --valence-n2:  color-mix(in oklab, var(--brand-negative) 82%, var(--surface-2));
  --valence-n1:  color-mix(in oklab, var(--brand-negative) 52%, var(--surface-2));
  --valence-0:   var(--ink-ghost);
  --valence-p1:  color-mix(in oklab, var(--brand-positive) 52%, var(--surface-2));
  --valence-p2:  color-mix(in oklab, var(--brand-positive) 82%, var(--surface-2));

  /* markers */
  --marker-critical:    var(--brand-attention);   /* momentOfTruth   */
  --marker-fail:        var(--brand-negative);    /* failureMode     */
  --marker-opportunity: var(--brand-positive);    /* opportunity     */
  --marker-machine:     var(--brand-machine);     /* automation      */
  --marker-pain:        color-mix(in oklab, var(--brand-negative) 62%, var(--brand-primary)); /* painPoint */

  /* Two colours that pair with *data*, not with the page, so they must NOT flip
     with the theme: text sitting on a saturated fill, and the colour a shadow is
     cast in. Inverting either is the classic dark-mode bug. */
  --ink-on-fill: oklch(22% 0.014 70);
  --shadow-ink:  oklch(12% 0.010 60);

  /* actor kinds (categorical — limit to 4, per the guide's 6–8 hue ceiling) */
  --actor-primary:   var(--brand-primary);
  --actor-system:    var(--brand-machine);
  --actor-backstage: var(--brand-secondary);
  --actor-none:      var(--ink-faint);

  /* categorical — unordered groups: milestones, lanes, channels. Never use
     these for anything ordered; lightness (the ramp below) encodes magnitude. */
  --cat-1: var(--brand-cat-1);
  --cat-2: var(--brand-cat-2);
  --cat-3: var(--brand-cat-3);
  --cat-4: var(--brand-cat-4);
  --cat-5: var(--brand-cat-5);
  --cat-1-soft: color-mix(in oklab, var(--brand-cat-1) 16%, var(--bg));
  --cat-2-soft: color-mix(in oklab, var(--brand-cat-2) 16%, var(--bg));
  --cat-3-soft: color-mix(in oklab, var(--brand-cat-3) 16%, var(--bg));
  --cat-4-soft: color-mix(in oklab, var(--brand-cat-4) 16%, var(--bg));
  --cat-5-soft: color-mix(in oklab, var(--brand-cat-5) 16%, var(--bg));

  /* service layers */
  --layer-customer-bg:  color-mix(in oklab, var(--brand-primary) 9%, var(--bg));
  --layer-customer-ln:  var(--accent-line);
  --layer-backstage-bg: var(--surface-2);
  --layer-backstage-ln: var(--line);
  --layer-support-bg:   var(--surface-1);
  --layer-support-ln:   var(--line-soft);

  /* sequential ramp — ordered magnitude (density, duration, count). Single hue,
     stepped in oklab so equal numeric steps read as equal perceptual steps. */
  --ramp-0: var(--surface-1);
  --ramp-1: color-mix(in oklab, var(--brand-primary) 18%, var(--surface-1));
  --ramp-2: color-mix(in oklab, var(--brand-primary) 36%, var(--surface-1));
  --ramp-3: color-mix(in oklab, var(--brand-primary) 56%, var(--surface-1));
  --ramp-4: color-mix(in oklab, var(--brand-primary) 78%, var(--surface-1));
  --ramp-5: var(--brand-primary);

  /* provenance — the skill's own metadata, so it gets first-class tokens */
  --prov-model:  var(--ink-ghost);                /* model-authored (default)  */
  --prov-user:   var(--brand-primary);            /* user-modified             */
  --prov-source: var(--brand-secondary);          /* source-backed             */
  --prov-auto:   var(--brand-machine);            /* auto-composite            */

  /* priority */
  --prio-must:   var(--brand-negative);
  --prio-should: var(--brand-primary);
  --prio-nice:   var(--ink-faint);

  /* type — fluid modular scale, ratio 1.2 */
  --font:      var(--brand-font);
  --font-mono: var(--brand-font-mono);
  --step--2: clamp(0.60rem, 0.58rem + 0.10vw, 0.66rem);
  --step--1: clamp(0.72rem, 0.69rem + 0.14vw, 0.80rem);
  --step-0:  clamp(0.86rem, 0.82rem + 0.18vw, 0.95rem);
  --step-1:  clamp(1.03rem, 0.97rem + 0.28vw, 1.19rem);
  --step-2:  clamp(1.24rem, 1.14rem + 0.48vw, 1.55rem);
  --step-3:  clamp(1.60rem, 1.40rem + 1.00vw, 2.40rem);
  --step-4:  clamp(2.10rem, 1.70rem + 2.00vw, 4.00rem);

  /* space — deliberately uneven, so rhythm is possible */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 13px; --sp-4: 21px;
  --sp-5: 34px; --sp-6: 55px; --sp-7: 89px;

  --radius: var(--brand-radius);
  --dur-fast: 140ms; --dur: 260ms; --dur-slow: 620ms;
  --ease: cubic-bezier(.22,.61,.36,1);          /* ease-out-quart, no bounce */
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
}
/* tokens:end */
/* theme:begin */
/* theme:end */

  :root{--v:var(--line-strong)}   /* set per selected point at runtime */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:44px 24px 70px}

  .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
          margin-bottom:10px}
  h1{font-size:clamp(1.7rem,3.6vw,2.3rem);line-height:1.12;letter-spacing:-.025em;margin:0 0 12px}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{color:var(--ink-muted);max-width:64ch;margin:0 0 30px}

  .chart{border:1px solid var(--line);border-radius:10px;background:var(--surface-1);
         padding:26px 22px 14px;overflow-x:auto}
  svg{display:block;width:100%;height:auto;min-width:640px}

  .axis-line{stroke:var(--line);stroke-width:1}
  .zero-line{stroke:var(--line-strong);stroke-width:1}
  .axis-lbl{fill:var(--ink-faint);font-size:10px;font-family:var(--font-mono)}
  .mst-div{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
  .mst-lbl{fill:var(--ink-faint);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

  .area{fill:var(--accent);opacity:.10}
  .area.neg{fill:var(--marker-fail);opacity:.13}
  .curve{fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

  .pt{cursor:pointer}
  .pt circle{stroke:var(--surface-1);stroke-width:2;transition:r .12s}
  .pt:hover circle,.pt:focus-visible circle{r:9}
  .pt:focus-visible{outline:none}
  .pt text.n{font-family:var(--font-mono);font-size:9px;fill:var(--ink-on-fill);
             text-anchor:middle;pointer-events:none}
  .pt.is-truth circle{stroke:var(--marker-critical);stroke-width:2.5}
  .x-lbl{fill:var(--ink-faint);font-size:10px;text-anchor:end}
  .x-lbl.low{fill:var(--marker-fail);font-weight:600}

  .note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
        display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .note h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
           margin:0 0 8px}
  .note p{margin:0;font-size:13.5px;color:var(--ink-muted)}
  .note b{color:var(--ink);font-weight:600}

  .readout{margin-top:22px;border:1px solid var(--line);border-left:3px solid var(--v,var(--line-strong));
           border-radius:8px;background:var(--surface-2);padding:16px 18px;min-height:118px}
  .readout .hd{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:6px}
  .readout .step{font-weight:600;font-size:15px}
  .readout .sid{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-ghost)}
  .readout .v{font-family:var(--font-mono);font-size:12px;color:var(--v);margin-left:auto}
  .readout .emo{color:var(--v);font-size:13.5px;margin:0 0 6px}
  .readout .think{color:var(--ink);font-size:13.5px;margin:0;font-style:italic}
  .readout .hint{color:var(--ink-faint);font-size:13px;margin:0}

  .legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;font-size:12px;color:var(--ink-muted)}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;
            vertical-align:-1px}
  .foot{margin-top:34px;font-size:12px;color:var(--ink-faint);font-family:var(--font-mono)}
  @media(max-width:720px){.note{grid-template-columns:1fr;gap:16px}}
</style>

<body>
<div class="wrap">
  <div class="kicker">Rendering · Emotion curve</div>
  <h1>Rejection is <em>not</em> the low point.</h1>
  <p class="lede" id="lede"></p>

  <div class="chart">

         aria-label="Emotional valence across the journey, from +2 to -2"></svg>
  </div>

  <div class="readout" id="readout">
    <p class="hint">Hover or focus any point to read the step behind it.</p>
  </div>

  <div class="legend">
    <span><i style="background:var(--valence-p2)"></i>positive</span>
    <span><i style="background:var(--valence-0)"></i>neutral</span>
    <span><i style="background:var(--valence-n2)"></i>negative</span>
    <span><i style="background:none;border:2px solid var(--marker-critical)"></i>moment of truth</span>
  </div>

  <div class="note">
    <div><h2>What the shape says</h2>
      <p id="n1"></p></div>
    <div><h2>Where it comes from</h2>
      <p id="n2"></p></div>
  </div>

  <p class="foot" id="foot"></p>
</div>

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const VTOK = { "-2":"--valence-n2","-1":"--valence-n1","0":"--valence-0","1":"--valence-p1","2":"--valence-p2" };
const LABEL = s => s.replace(/-/g, " ").replace(/^./, c => c.toUpperCase());

// A step with no human in it has no emotion to plot. Dropping it is the honest
// move: interpolating a number for the AI screen would invent a feeling.
const PTS = JOURNEY.milestones.flatMap(m => m.steps.map(s => ({ s, m })))
  .map(({ s, m }) => ({ s, m, v: parseInt(s.fields.emotionValence, 10) }))
  .filter(p => Number.isFinite(p.v));

const W = 980, H = 400, L = 96, R = 30, T = 28, B = 96;
const x = i => L + (i * (W - L - R)) / Math.max(1, PTS.length - 1);
const y = v => T + ((2 - v) * (H - T - B)) / 4;

const svg = $("svg");

// milestone bands first, so everything else sits on top of them
let seen = null;
PTS.forEach((p, i) => {
  if (p.m.id === seen) return;
  seen = p.m.id;
  if (i > 0) svg.appendChild(el("line", { class: "mst-div", x1: x(i) - 18, x2: x(i) - 18, y1: T, y2: H - B }));
  const t = el("text", { class: "mst-lbl", x: x(i) - (i ? 10 : 0), y: T - 10 });
  t.textContent = p.m.fields.title || p.m.id;
  svg.appendChild(t);
});

// grid + y axis
[2, 1, 0, -1, -2].forEach(v => {
  svg.appendChild(el("line", { class: v === 0 ? "zero-line" : "axis-line",
    x1: L - 8, x2: W - R, y1: y(v), y2: y(v) }));
  const t = el("text", { class: "axis-lbl", x: L - 14, y: y(v) + 3.5, "text-anchor": "end" });
  t.textContent = v > 0 ? "+" + v : v;
  svg.appendChild(t);
});

const line = PTS.map((p, i) => x(i) + "," + y(p.v)).join(" ");
// split the fill at the zero line so falling below it reads as a different thing
svg.appendChild(el("polygon", { class: "area",
  points: L + "," + y(0) + " " + line + " " + x(PTS.length - 1) + "," + y(0) }));
svg.appendChild(el("polyline", { class: "curve", points: line }));

const MIN = Math.min(...PTS.map(p => p.v));
const FLOOR = PTS.filter(p => p.v === MIN).map(p => p.s.id);
const REJECTIONS = PTS.filter(p => /rejection/.test(p.s.id));

PTS.forEach((p, i) => {
  const g = el("g", { class: "pt" + (p.s.fields.momentOfTruth ? " is-truth" : ""),
                      tabindex: "0", role: "button" });
  g.appendChild(el("circle", { cx: x(i), cy: y(p.v), r: 6.5,
                               fill: "var(" + VTOK[String(p.v)] + ")" }));
  const lbl = el("text", { class: "x-lbl" + (FLOOR.includes(p.s.id) ? " low" : ""),
                           x: x(i), y: H - B + 20,
                           transform: "rotate(-38 " + x(i) + " " + (H - B + 20) + ")" });
  lbl.textContent = LABEL(p.s.id);
  svg.appendChild(g); svg.appendChild(lbl);

  const show = () => {
    const f = p.s.fields;
    $("readout").style.setProperty("--v", "var(" + VTOK[String(p.v)] + ")");
    $("readout").innerHTML =
      '<div class="hd"><span class="step">' + LABEL(p.s.id) + "</span>" +
      '<span class="sid">' + p.s.id + "</span>" +
      '<span class="v">' + (p.v > 0 ? "+" : "") + p.v +
        (f.emotionIntensity ? " · " + f.emotionIntensity : "") + "</span></div>" +
      (f.emotion ? '<p class="emo">' + f.emotion + "</p>" : "") +
      (f.thinking ? '<p class="think">' + f.thinking + "</p>"
                  : '<p class="hint">' + (f.description || "") + "</p>");
  };
  g.addEventListener("mouseenter", show);
  g.addEventListener("focus", show);
});

$("lede").textContent = JOURNEY.journey +
  " — emotional valence for every step that has a person in it. " +
  "The AI screen is absent on purpose: nobody is feeling anything during it.";
$("n1").innerHTML =
  "Every rejection on this map scores " +
  [...new Set(REJECTIONS.map(p => p.v))].map(v => "<b>" + v + "</b>").join(" and ") +
  ". The floor — " + MIN + " — is somewhere else entirely, and it is not one step but " +
  FLOOR.length + ": <b>" + FLOOR.map(LABEL).join("</b>, <b>") + "</b>. " +
  "Getting told no is survivable. Not being told anything is what the shape is about.";
$("n2").innerHTML = "Every point is the step's own <b>emotionValence</b>, authored with the map " +
  "rather than inferred from the prose at render time. " + PTS.length + " of " +
  JOURNEY.stepCount + " steps carry one; the rest have no human in them.";
$("foot").textContent = "source · " + JOURNEY.source + " · " + PTS.length + " plotted of " +
  JOURNEY.stepCount + " steps";
</script>

<script>
/* ==========================================================================
   switcher.js — the theme control every rendering carries.

   A rendering ships dark. What it does NOT ship is a fixed identity: paper,
   brand and light are one click away, because that is the honest demonstration
   of a token layer — the reader re-seeds Tier 1 and watches the whole palette
   re-derive, rather than being shown four files that someone styled four times.

   Mechanism: presets are written as INLINE custom properties on <html>. Element
   style beats every stylesheet rule, so this sidesteps the specificity fight
   between a :root override and the token file's dark blocks entirely (see
   journey-tokens.css § OVERRIDING TIER 1). data-theme still selects which of
   the shipped palettes derives underneath.
   ========================================================================== */
(function () {
  var root = document.documentElement;

  var PRESETS = {
    dark:  { theme: "dark",  seeds: null, label: "Dark" },
    light: { theme: "light", seeds: null, label: "Light" },
    paper: { theme: "light", label: "Paper", seeds: {
      "--brand-surface":  "oklch(96.5% 0.011 85)",
      "--brand-text":     "oklch(19% 0.006 80)",
      "--brand-primary":  "oklch(58% 0.098 62)",
      "--brand-negative": "oklch(50% 0.155 28)"
    }},
    brand: { theme: "dark", label: "Brand", seeds: {
      "--brand-primary":    "#A97BF0",
      "--brand-surface":    "#14101c",
      "--brand-text":       "#ece8f5",
      "--brand-on-primary": "#14101c"
    }}
  };
  var SEED_KEYS = ["--brand-surface","--brand-text","--brand-primary","--brand-negative",
                   "--brand-secondary","--brand-positive","--brand-on-primary","--brand-attention"];

  function apply(name) {
    var p = PRESETS[name] || PRESETS.dark;
    SEED_KEYS.forEach(function (k) { root.style.removeProperty(k); });
    if (p.seeds) Object.keys(p.seeds).forEach(function (k) { root.style.setProperty(k, p.seeds[k]); });
    root.setAttribute("data-theme", p.theme);
    root.setAttribute("data-preset", name);
    try { sessionStorage.setItem("journey-theme", name); } catch (e) {}
    [].forEach.call(box.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.preset === name));
    });
  }

  var box = document.createElement("div");
  box.className = "journey-theme-switch";
  box.setAttribute("role", "group");
  box.setAttribute("aria-label", "Theme");
  box.innerHTML =
    '<style>' +
    '.journey-theme-switch{position:fixed;top:14px;right:14px;z-index:9999;display:flex;gap:2px;' +
      'padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-1);' +
      'font:500 10px/1 var(--font);letter-spacing:.09em;' +
      'text-transform:uppercase;box-shadow:0 2px 10px color-mix(in oklab,var(--shadow-ink) 22%,transparent)}' +
    '.journey-theme-switch button{border:0;background:none;color:var(--ink-muted);cursor:pointer;' +
      'padding:6px 10px;border-radius:999px;font:inherit;transition:color .12s,background .12s}' +
    '.journey-theme-switch button:hover{color:var(--ink)}' +
    '.journey-theme-switch button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}' +
    '.journey-theme-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}' +
    '@media print{.journey-theme-switch{display:none}}' +
    '</style>' +
    Object.keys(PRESETS).map(function (k) {
      return '<button type="button" data-preset="' + k + '" aria-pressed="false">' +
             PRESETS[k].label + '</button>';
    }).join("");

  box.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-preset]");
    if (b) apply(b.dataset.preset);
  });

  function mount() {
    document.body.appendChild(box);
    var saved;
    try { saved = sessionStorage.getItem("journey-theme"); } catch (e) {}
    apply(saved && PRESETS[saved] ? saved : (root.getAttribute("data-preset") || "dark"));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
  else mount();
})();
</script>
