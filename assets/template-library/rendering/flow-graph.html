<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow graph rendering — reference template</title>
<!--
  FLOW GRAPH rendering (6th rendering mode, analytical). A node-link graph of the
  journey's actual topology. Use it when the map branches, loops, or has more than one
  ending — every sequential mode (timeline, swimlane, storyboard) flattens those into a
  line and quietly asserts something false. This is the only mode that can show a step
  with no way out of it. Pairs with Scroll-driven, Focus+Context, or Zoom-pan.

  Offer it ALONGSIDE a sequential mode, not instead of one: a room that has never seen
  the journey needs the walk before it needs the topology.

  DATA MAPPING (journey field → graph element):
    node          ← each step; label from `title`/id, sublabel from `persona`
    node tint     ← emotionValence (diverging, via --valence-*)
    edge          ← `next:` (single value = one edge)
    fork          ← `next:` with sub-bullets; edge label ← the condition text
    branch note   ← `branchCondition` (rendered beside the fork)
    parallel edge ← `parallelPath` (dashed — concurrent, not alternative)
    recovery edge ← `recoveryPath` (dotted, curving back)
    entry / exit  ← `entryPoint: true` / `exitPoint: true`
    DEAD END      ← a step with exitPoint and no outgoing edge → the strongest mark
                    on the canvas. This is usually the finding.
    marker        ← momentOfTruth (--marker-critical), failureMode (--marker-fail)

  LAYOUT: keep it deterministic — document order down the main spine, forks offset to
  the side, so the same file always draws the same graph. Do not use a force layout: a
  journey graph that moves between renders is not a document.

  ACCESSIBILITY: valence tint is never the only signal — each node also carries its
  numeral and, where relevant, a marker glyph. Edge labels are text, not colour.
-->
<style>
/* tokens:begin */
/* ============================================================================
   journey-tokens.css — the single source of truth for every journey rendering.

   Tier 1  brand seed      ~10 values. The only thing a user/brand ever changes.
   Tier 2  semantic        derived from Tier 1. Renderings consume THESE.
   Tier 3  component       declared locally inside each rendering, from Tier 2.

   Rule for renderings: zero literal colors. If you type a hex, it belongs here.
   Themes: base = light. Dark re-derives (never inverts) via prefers-color-scheme
   and [data-theme], so a manual toggle wins in both directions.

   The shipped seed is deliberately neutral: white paper, near-black ink, a grey
   scale between them, and ONE hue (attention) for the moment of truth. Emotion
   valence is a lightness ramp from paper (positive, drawn hollow) to ink
   (negative, drawn solid), never a red/green pair, so the one hue on the page
   is always the one thing to look at. Presets and brand reseeds may bring hue
   back; the default does not.

   OVERRIDING TIER 1 (brand themes, paper artifacts): the dark blocks below are
   selected by :root:not([data-theme="light"]) and :root[data-theme="dark"],
   both of which out-specify a bare :root. So an artifact that reseeds Tier 1
   must also pin its theme on the element:

       <html data-theme="light">   ← now the dark blocks cannot match, and a
                                     later :root{...} override wins on order

   Reseeding at :root without pinning a theme silently does nothing for readers
   whose system is set to dark. See renderings/food-delivery--swimlane-themed
   (a brand reseed) and renderings/job-application--storyboard (a paper reseed).
   ========================================================================= */

/* ── Tier 1 · brand seed ───────────────────────────────────────────────── */
:root{
  --brand-primary:    #09090b;                  /* chrome, accent, selection — the
                                                   focal colour IS the ink       */
  --brand-secondary:  #52525b;                  /* second categorical tone      */
  --brand-surface:    #ffffff;                  /* page ground                  */
  --brand-text:       #09090b;                  /* body ink                     */
  --brand-positive:   #ffffff;                  /* semantic good = the paper end
                                                   of the valence ramp (hollow)  */
  --brand-negative:   #09090b;                  /* semantic bad = the ink end
                                                   of the valence ramp (solid)   */
  --brand-machine:    #71717a;                  /* automated / no-human paths   */
  --brand-on-primary: #ffffff;                  /* text that sits ON the primary */
  --brand-attention:  #dc2626;                  /* momentOfTruth — the ONE hue.
                                                   NOT the brand: a marker that
                                                   repaints itself when the logo
                                                   changes is not a marker
                                                   (guide § colour) */
  /* categorical seed — Okabe-Ito, distinguishable under all three common
     colour-vision deficiencies. Independent of brand on purpose (see
     html-rendering-guide § accessibility); override only if the brand's own
     categorical palette has been checked for the same. */
  --brand-cat-1:      oklch(56% 0.108 248);     /* blue            */
  --brand-cat-2:      oklch(62% 0.155 42);      /* vermillion      */
  --brand-cat-3:      oklch(60% 0.098 168);     /* bluish green    */
  --brand-cat-4:      oklch(72% 0.145 78);      /* orange          */
  --brand-cat-5:      oklch(56% 0.112 340);     /* reddish purple  */
  --brand-font:       "Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --brand-font-mono:  "Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --brand-radius:     6px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-primary:   #fafafa;
    --brand-secondary: #a1a1aa;
    --brand-surface:   #09090b;
    --brand-text:      #fafafa;
    --brand-positive:  #09090b;
    --brand-negative:  #fafafa;
    --brand-machine:   #a1a1aa;
    --brand-on-primary:#09090b;
    --brand-attention: #f87171;
    --brand-cat-1:     oklch(70% 0.098 248);
    --brand-cat-2:     oklch(72% 0.140 42);
    --brand-cat-3:     oklch(70% 0.090 168);
    --brand-cat-4:     oklch(78% 0.130 78);
    --brand-cat-5:     oklch(68% 0.102 340);
  }
}
:root[data-theme="dark"]{
  --brand-primary:   #fafafa;
  --brand-secondary: #a1a1aa;
  --brand-surface:   #09090b;
  --brand-text:      #fafafa;
  --brand-positive:  #09090b;
  --brand-negative:  #fafafa;
  --brand-machine:   #a1a1aa;
  --brand-on-primary:#09090b;
  --brand-attention: #f87171;
  --brand-cat-1:     oklch(70% 0.098 248);
  --brand-cat-2:     oklch(72% 0.140 42);
  --brand-cat-3:     oklch(70% 0.090 168);
  --brand-cat-4:     oklch(78% 0.130 78);
  --brand-cat-5:     oklch(68% 0.102 340);
}

/* ── Tier 2 · semantic ─────────────────────────────────────────────────── */
:root{
  /* ground & elevation — dark re-derives by mixing toward ink, not by inverting */
  --bg:          var(--brand-surface);
  --surface-1:   color-mix(in oklab, var(--brand-surface) 97%, var(--brand-text));
  --surface-2:   color-mix(in oklab, var(--brand-surface) 93%, var(--brand-text));
  --surface-3:   color-mix(in oklab, var(--brand-surface) 88%, var(--brand-text));

  /* ink */
  --ink:         var(--brand-text);
  --ink-muted:   color-mix(in oklab, var(--brand-text) 58%, var(--brand-surface));
  --ink-faint:   color-mix(in oklab, var(--brand-text) 36%, var(--brand-surface));
  --ink-ghost:   color-mix(in oklab, var(--brand-text) 20%, var(--brand-surface));

  /* rules */
  --line:        color-mix(in oklab, var(--brand-text) 16%, var(--brand-surface));
  --line-soft:   color-mix(in oklab, var(--brand-text) 9%,  var(--brand-surface));
  --line-strong: color-mix(in oklab, var(--brand-text) 34%, var(--brand-surface));

  /* accent */
  --accent:       var(--brand-primary);
  --accent-soft:  color-mix(in oklab, var(--brand-primary) 16%, var(--brand-surface));
  --accent-line:  color-mix(in oklab, var(--brand-primary) 55%, var(--brand-surface));
  --accent-ink:   color-mix(in oklab, var(--brand-primary) 18%, var(--brand-text));
  --ink-on-accent: var(--brand-on-primary);

  /* emotion valence — diverging, 5 stops. Deliberately held one step back from
     full strength: valence is the *field*, markers are annotations laid on top of
     it, and a marker that reads as just another data point has failed. NEVER the
     sole encoding either — always pair with position, a numeral, or a glyph
     (see html-rendering-guide § accessibility). */
  --valence-n2:  color-mix(in oklab, var(--brand-negative) 82%, var(--surface-2));
  --valence-n1:  color-mix(in oklab, var(--brand-negative) 52%, var(--surface-2));
  --valence-0:   var(--ink-ghost);
  --valence-p1:  color-mix(in oklab, var(--brand-positive) 52%, var(--surface-2));
  --valence-p2:  color-mix(in oklab, var(--brand-positive) 82%, var(--surface-2));

  /* markers */
  --marker-critical:    var(--brand-attention);   /* momentOfTruth   */
  --marker-fail:        var(--brand-negative);    /* failureMode     */
  --marker-opportunity: color-mix(in oklab, var(--brand-positive) 60%, var(--brand-text)); /* opportunity —
                                                     darker than the valence fill it
                                                     shares a seed with, so it reads
                                                     as a line, not a tint */
  --marker-machine:     var(--brand-machine);     /* automation      */
  --marker-pain:        color-mix(in oklab, var(--brand-negative) 62%, var(--brand-primary)); /* painPoint */

  /* Two colours that pair with *data*, not with the page, so they must NOT flip
     with the theme: text sitting on a saturated fill, and the colour a shadow is
     cast in. Inverting either is the classic dark-mode bug. */
  --ink-on-fill: #09090b;
  --shadow-ink:  #09090b;

  /* actor kinds (categorical — limit to 4, per the guide's 6–8 hue ceiling) */
  --actor-primary:   var(--brand-primary);
  --actor-system:    var(--brand-machine);
  --actor-backstage: var(--brand-secondary);
  --actor-none:      var(--ink-faint);

  /* categorical — unordered groups: milestones, lanes, channels. Never use
     these for anything ordered; lightness (the ramp below) encodes magnitude. */
  --cat-1: var(--brand-cat-1);
  --cat-2: var(--brand-cat-2);
  --cat-3: var(--brand-cat-3);
  --cat-4: var(--brand-cat-4);
  --cat-5: var(--brand-cat-5);
  --cat-1-soft: color-mix(in oklab, var(--brand-cat-1) 16%, var(--bg));
  --cat-2-soft: color-mix(in oklab, var(--brand-cat-2) 16%, var(--bg));
  --cat-3-soft: color-mix(in oklab, var(--brand-cat-3) 16%, var(--bg));
  --cat-4-soft: color-mix(in oklab, var(--brand-cat-4) 16%, var(--bg));
  --cat-5-soft: color-mix(in oklab, var(--brand-cat-5) 16%, var(--bg));

  /* service layers */
  --layer-customer-bg:  color-mix(in oklab, var(--brand-primary) 9%, var(--bg));
  --layer-customer-ln:  var(--accent-line);
  --layer-backstage-bg: var(--surface-2);
  --layer-backstage-ln: var(--line);
  --layer-support-bg:   var(--surface-1);
  --layer-support-ln:   var(--line-soft);

  /* sequential ramp — ordered magnitude (density, duration, count). Single hue,
     stepped in oklab so equal numeric steps read as equal perceptual steps. */
  --ramp-0: var(--surface-1);
  --ramp-1: color-mix(in oklab, var(--brand-primary) 18%, var(--surface-1));
  --ramp-2: color-mix(in oklab, var(--brand-primary) 36%, var(--surface-1));
  --ramp-3: color-mix(in oklab, var(--brand-primary) 56%, var(--surface-1));
  --ramp-4: color-mix(in oklab, var(--brand-primary) 78%, var(--surface-1));
  --ramp-5: var(--brand-primary);

  /* provenance — the skill's own metadata, so it gets first-class tokens */
  --prov-model:  var(--ink-ghost);                /* model-authored (default)  */
  --prov-user:   var(--brand-primary);            /* user-modified             */
  --prov-source: var(--brand-secondary);          /* source-backed             */
  --prov-auto:   var(--brand-machine);            /* auto-composite            */

  /* priority */
  --prio-must:   var(--brand-negative);
  --prio-should: var(--brand-primary);
  --prio-nice:   var(--ink-faint);

  /* type — fluid modular scale, ratio 1.2 */
  --font:      var(--brand-font);
  --font-mono: var(--brand-font-mono);
  --step--2: clamp(0.60rem, 0.58rem + 0.10vw, 0.66rem);
  --step--1: clamp(0.72rem, 0.69rem + 0.14vw, 0.80rem);
  --step-0:  clamp(0.86rem, 0.82rem + 0.18vw, 0.95rem);
  --step-1:  clamp(1.03rem, 0.97rem + 0.28vw, 1.19rem);
  --step-2:  clamp(1.24rem, 1.14rem + 0.48vw, 1.55rem);
  --step-3:  clamp(1.60rem, 1.40rem + 1.00vw, 2.40rem);
  --step-4:  clamp(2.10rem, 1.70rem + 2.00vw, 4.00rem);

  /* space — deliberately uneven, so rhythm is possible */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 13px; --sp-4: 21px;
  --sp-5: 34px; --sp-6: 55px; --sp-7: 89px;

  --radius: var(--brand-radius);
  --dur-fast: 140ms; --dur: 260ms; --dur-slow: 620ms;
  --ease: cubic-bezier(.22,.61,.36,1);          /* ease-out-quart, no bounce */
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
}
/* tokens:end */
/* theme:begin */
/* theme:end */

  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:var(--font);line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 24px}
  h1{font-size:1.5rem;margin:0 0 6px}
  .sub{color:var(--ink-muted);margin:0 0 28px;max-width:60ch}

  .canvas{position:relative;border:1px solid var(--line);border-radius:10px;
          background:var(--surface-1);padding:24px;overflow:auto}

  /* milestone bands read as background, never as foreground */
  .band{fill:var(--surface-2)}
  .band-label{fill:var(--ink-faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase}

  .node rect{fill:var(--bg);stroke:var(--line-strong);stroke-width:1}
  .node.is-entry rect{stroke:var(--accent);stroke-width:2}
  .node.is-exit  rect{stroke-dasharray:none;stroke:var(--ink-muted)}
  .node.is-deadend rect{stroke:var(--marker-fail);stroke-width:2}
  .node .id{fill:var(--ink-faint);font-size:9px;font-family:var(--font-mono)}
  .node .label{fill:var(--ink);font-size:13px;font-weight:600}
  .node .val{font-size:10px;font-family:var(--font-mono)}

  .edge{stroke:var(--line-strong);stroke-width:1.5;fill:none;marker-end:url(#arrow)}
  .edge.is-parallel{stroke-dasharray:5 4}       /* concurrent, not alternative */
  .edge.is-recovery{stroke-dasharray:2 4;stroke:var(--ink-faint)}
  .edge-label{fill:var(--ink-muted);font-size:10px;
              font-family:var(--font-mono)}

  .mk{font-size:10px}
  .mk.truth{fill:var(--marker-critical)}
  .mk.fail{fill:var(--marker-fail)}

  .legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;
          font-size:12px;color:var(--ink-muted)}
  .legend b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Journey title — where it forks</h1>
  <p class="sub">One sentence naming what the topology shows: how many forks, how many
  endings, and which ending has no way out of it.</p>

  <div class="canvas">
    <svg class="graph" viewBox="0 0 900 520" width="100%" role="img"
         aria-label="Flow graph of the journey: nodes are steps, edges are next links">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--line-strong)"/>
        </marker>
      </defs>

      <!-- milestone band -->
      <rect class="band" x="20" y="20" width="860" height="150" rx="6"/>
      <text class="band-label" x="34" y="40">milestone id</text>

      <!-- a step -->
      <g class="node is-entry" transform="translate(330,58)">
        <rect width="250" height="54" rx="6"/>
        <text class="id"    x="12" y="18">step-id</text>
        <text class="label" x="12" y="36">Step title</text>
        <text class="val"   x="238" y="36" text-anchor="end"
              fill="var(--valence-p1)">+1</text>
      </g>

      <!-- a plain next: edge -->
      <path class="edge" d="M455,112 L455,168"/>

      <!-- a fork: two labelled edges out of one node -->
      <path class="edge" d="M455,222 C455,250 300,250 300,278"/>
      <text class="edge-label" x="296" y="266" text-anchor="end">no match</text>
      <path class="edge" d="M455,222 C455,250 610,250 610,278"/>
      <text class="edge-label" x="616" y="266">match</text>

      <!-- an ending nothing leaves: the finding, marked hardest -->
      <g class="node is-deadend" transform="translate(175,278)">
        <rect width="250" height="54" rx="6"/>
        <text class="id"    x="12" y="18">outcome-ghosted</text>
        <text class="label" x="12" y="36">No way out</text>
        <text class="mk fail" x="238" y="36" text-anchor="end">⚑</text>
      </g>
    </svg>
  </div>

  <div class="legend">
    <span><b>◆</b> moment of truth</span>
    <span><b>⚑</b> failure mode</span>
    <span><b>— —</b> parallel path (concurrent)</span>
    <span><b>· · ·</b> recovery path</span>
    <span><b>red outline</b> an ending with no outgoing edge</span>
  </div>
</div>
</body>
</html>
