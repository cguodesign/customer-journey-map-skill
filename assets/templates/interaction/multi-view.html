<!DOCTYPE html>
<html lang="en">
<!-- INTERACTION: Multi-view. Tab switching between multiple views of the same data.
     Best for: comparing perspectives, role-based views, rendering mode previews. Combine with: any rendering mode. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaction: Multi-view</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333}
.filter-bar{padding:10px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center}
.filter-bar label{font-size:12px;color:#888}
.filter-bar select{padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
.tab-bar{display:flex;background:#fff;border-bottom:2px solid #ddd;padding:0 16px}
.tab{padding:10px 20px;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;user-select:none}
.tab.active{color:#333;border-bottom-color:#555}
.tab:hover:not(.active){color:#555}
/* INTEGRATE: Each tab contains a different rendering mode. All share the same journeyData object. */
.view{display:none;padding:16px;max-width:720px;margin:0 auto}
.view.active{display:block}
.block{background:#e0e0e0;border-radius:6px;padding:14px;margin-bottom:10px;font-size:13px;color:#555;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.block.selected{border-color:#888}
.block.hidden{display:none}
.view-b .block{background:#d8d8d8;border-radius:0;border-left:3px solid #aaa}
.view-c .block{background:#ddd;display:inline-block;width:calc(50% - 8px);margin-right:8px;vertical-align:top}
</style>
</head>
<body>
<!-- Shared filter: affects all views -->
<div class="filter-bar">
  <label>Filter:</label>
  <select id="filter"><option value="all">All items</option><option value="x">Category X</option><option value="y">Category Y</option></select>
</div>
<nav class="tab-bar" id="tabBar">
  <div class="tab active" data-tab="a">View A</div>
  <div class="tab" data-tab="b">View B</div>
  <div class="tab" data-tab="c">View C</div>
</nav>
<!-- STATE: Track selectedStepId, expandedSteps[], and filterState globally. Apply to whichever view is active. -->
<div class="view active" id="view-a">
  <div class="block" data-id="1" data-cat="x">Item 1</div>
  <div class="block" data-id="2" data-cat="y">Item 2</div>
  <div class="block" data-id="3" data-cat="x">Item 3</div>
  <div class="block" data-id="4" data-cat="y">Item 4</div>
</div>
<div class="view view-b" id="view-b">
  <div class="block" data-id="1" data-cat="x">Item 1</div>
  <div class="block" data-id="2" data-cat="y">Item 2</div>
  <div class="block" data-id="3" data-cat="x">Item 3</div>
  <div class="block" data-id="4" data-cat="y">Item 4</div>
</div>
<div class="view view-c" id="view-c">
  <div class="block" data-id="1" data-cat="x">Item 1</div>
  <div class="block" data-id="2" data-cat="y">Item 2</div>
  <div class="block" data-id="3" data-cat="x">Item 3</div>
  <div class="block" data-id="4" data-cat="y">Item 4</div>
</div>
<script>
// --- Global State ---
const state = { selectedId: null, filter: 'all' }; // Cross-view state shared across all tabs
const allBlocks = () => document.querySelectorAll('.block');
const tabs = document.querySelectorAll('.tab');
const views = document.querySelectorAll('.view');

// --- Tab Switching ---
document.getElementById('tabBar').addEventListener('click', e => { // Click tab to show corresponding view
  const tab = e.target.closest('.tab');
  if (tab) activateTab(tab.dataset.tab);
});
function activateTab(id) { // Switch to the given tab and sync state
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  views.forEach(v => v.classList.toggle('active', v.id === `view-${id}`));
  applyState();
}

// --- Cross-view Selection ---
document.addEventListener('click', e => { // Clicking a block selects it across all views by data-id
  const block = e.target.closest('.block');
  if (!block) return;
  state.selectedId = state.selectedId === block.dataset.id ? null : block.dataset.id;
  applyState();
});

// --- Shared Filter ---
document.getElementById('filter').addEventListener('change', e => { // Filter dropdown affects all views
  state.filter = e.target.value;
  applyState();
});

// --- Apply State ---
function applyState() { // Sync selection and filter to all blocks in all views
  allBlocks().forEach(b => {
    b.classList.toggle('selected', b.dataset.id === state.selectedId);
    b.classList.toggle('hidden', state.filter !== 'all' && b.dataset.cat !== state.filter);
  });
}

// --- Keyboard Shortcuts ---
document.addEventListener('keydown', e => { // Ctrl+1/2/3 switches between tabs
  if ((e.ctrlKey || e.metaKey) && e.key >= '1' && e.key <= '3') {
    e.preventDefault();
    activateTab(['a', 'b', 'c'][parseInt(e.key) - 1]);
  }
});
</script>
</body>
</html>
