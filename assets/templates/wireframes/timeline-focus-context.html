<!-- Timeline × Focus+Context wireframe -->
<!-- Interactions: minimap with viewport indicator, scroll spy, milestone jump pills. See interaction/focus-context.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline × Focus+Context</title>
<style>
  :root { --bg: #f5f5f5; --card: #fff; --border: #d0d0d0; --muted: #999; --text: #444; --line: #ccc; --active: #bbb; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 12px/1.5 ui-monospace, SFMono-Regular, monospace; background: var(--bg); color: var(--text); padding: 16px; }
  h1 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  /* Minimap: compressed overview with viewport indicator -->  */
  .minimap { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); background: var(--card); margin-bottom: 8px; }
  .minimap-dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); }
  .minimap-dot.in-view { background: var(--active); }
  .viewport-indicator { font-size: 9px; color: var(--muted); margin-left: auto; border: 1px dashed var(--border); padding: 1px 6px; }
  /* <!-- milestone jump pills: click to scroll timeline to that milestone --> */
  .pills { display: flex; gap: 6px; margin-bottom: 12px; }
  .pill { padding: 3px 10px; font-size: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted); }
  .pill.active { background: var(--active); color: var(--text); }
  .timeline-wrap { overflow-x: auto; padding: 12px 0; }
  .timeline { position: relative; display: flex; align-items: center; min-width: 600px; height: 40px; }
  .timeline-line { position: absolute; top: 50%; left: 20px; right: 20px; height: 1px; background: var(--line); }
  .nodes { display: flex; justify-content: space-between; width: 100%; padding: 0 20px; position: relative; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .node-circle { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); }
  .node-circle.active { background: var(--active); }
  .node-label { font-size: 10px; color: var(--muted); }
  .milestone-bands { display: flex; gap: 0; margin-bottom: 4px; }
  .milestone-band { flex: 1; padding: 2px 10px; font-size: 10px; color: var(--muted); border: 1px solid var(--border); background: var(--card); text-align: center; min-width: 180px; }
</style>
</head>
<body>
<h1>Timeline &times; Focus+Context</h1>

<!-- Minimap: scroll spy updates dot highlights as timeline scrolls -->
<div class="minimap">
  <div class="minimap-dot in-view"></div>
  <div class="minimap-dot in-view"></div>
  <div class="minimap-dot in-view"></div>
  <div class="minimap-dot"></div>
  <div class="minimap-dot"></div>
  <div class="minimap-dot"></div>
  <span class="viewport-indicator">viewing 1–3 of 6</span>
</div>

<div class="pills">
  <div class="pill active">Milestone A</div>
  <div class="pill">Milestone B</div>
</div>

<div class="timeline-wrap">
  <div class="milestone-bands">
    <div class="milestone-band">Milestone A</div>
    <div class="milestone-band">Milestone B</div>
  </div>
  <div class="timeline">
    <div class="timeline-line"></div>
    <div class="nodes">
      <div class="node"><span class="node-circle active"></span><span class="node-label">S1</span></div>
      <div class="node"><span class="node-circle"></span><span class="node-label">S2</span></div>
      <div class="node"><span class="node-circle"></span><span class="node-label">S3</span></div>
      <div class="node"><span class="node-circle"></span><span class="node-label">S4</span></div>
      <div class="node"><span class="node-circle"></span><span class="node-label">S5</span></div>
      <div class="node"><span class="node-circle"></span><span class="node-label">S6</span></div>
    </div>
  </div>
</div>
</body>
</html>
