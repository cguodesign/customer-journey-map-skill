<!-- Swimlane × Zoom-pan wireframe -->
<!-- Interactions: drag pan, scroll zoom, corner minimap. See interaction/zoom-pan.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swimlane × Zoom-pan</title>
<style>
  :root { --bg: #f5f5f5; --card: #fff; --border: #d0d0d0; --muted: #999; --text: #444; --lane-bg: #fafafa; --canvas: #fafafa; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 12px/1.5 ui-monospace, SFMono-Regular, monospace; background: var(--bg); color: var(--text); padding: 16px; }
  h1 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  /* <!-- canvas: drag to pan, scroll to zoom --> */
  .canvas { position: relative; border: 2px solid var(--border); background: var(--canvas); padding: 30px 16px 40px; }
  .canvas-label { position: absolute; top: 4px; left: 8px; font-size: 9px; color: var(--muted); }
  .blueprint { display: grid; grid-template-columns: 80px repeat(3, 120px); }
  .phase-header { padding: 4px 6px; font-size: 10px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); background: var(--card); text-align: center; }
  .corner { border: 1px solid var(--border); background: var(--card); }
  .lane-label { padding: 6px 4px; font-size: 10px; font-weight: 600; border: 1px solid var(--border); background: var(--card); }
  .cell { border: 1px solid var(--border); background: var(--lane-bg); padding: 4px; min-height: 36px; }
  .cell-box { border: 1px solid var(--border); background: var(--card); padding: 3px 5px; font-size: 10px; }
  .divider-label { padding: 2px 4px; font-size: 9px; color: var(--muted); border: 1px solid var(--border); background: var(--card); }
  .divider-cell { border: 1px solid var(--border); border-top: 2px dashed var(--muted); height: 4px; }
  /* Zoom controls -->  */
  .zoom-controls { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 2px; }
  .zoom-btn { width: 22px; height: 22px; border: 1px solid var(--border); background: var(--card); text-align: center; font-size: 12px; color: var(--muted); line-height: 20px; }
  /* Corner minimap -->  */
  .minimap-rect { position: absolute; bottom: 8px; right: 8px; width: 80px; height: 36px; border: 1px solid var(--border); background: var(--card); }
  .minimap-viewport { position: absolute; top: 4px; left: 8px; width: 32px; height: 28px; border: 1px dashed var(--muted); }
  .minimap-label { position: absolute; bottom: 1px; left: 2px; font-size: 7px; color: var(--muted); }
</style>
</head>
<body>
<h1>Swimlane &times; Zoom-pan</h1>

<div class="canvas">
  <span class="canvas-label">drag to pan &middot; scroll to zoom</span>
  <div class="zoom-controls">
    <div class="zoom-btn">+</div>
    <div class="zoom-btn">&minus;</div>
    <div class="zoom-btn" style="font-size:9px;">fit</div>
  </div>

  <div class="blueprint">
    <div class="corner"></div>
    <div class="phase-header">Phase 1</div>
    <div class="phase-header">Phase 2</div>
    <div class="phase-header">Phase 3</div>
    <div class="lane-label">Actions</div>
    <div class="cell"><div class="cell-box">Task 1</div></div>
    <div class="cell"><div class="cell-box">Task 2</div></div>
    <div class="cell"><div class="cell-box">Task 3</div></div>
    <div class="lane-label">Frontstage</div>
    <div class="cell"><div class="cell-box">Touchpoint A</div></div>
    <div class="cell"><div class="cell-box">Touchpoint B</div></div>
    <div class="cell"><div class="cell-box">Touchpoint C</div></div>
    <div class="divider-label">- - -</div>
    <div class="divider-cell"></div>
    <div class="divider-cell"></div>
    <div class="divider-cell"></div>
    <div class="lane-label">Backstage</div>
    <div class="cell"><div class="cell-box">Process X</div></div>
    <div class="cell"><div class="cell-box">Process Y</div></div>
    <div class="cell"><div class="cell-box">Process Z</div></div>
  </div>

  <div class="minimap-rect">
    <div class="minimap-viewport"></div>
    <span class="minimap-label">minimap</span>
  </div>
</div>
</body>
</html>
