<!-- Emotion Curve × Scroll-driven wireframe -->
<!-- Interactions: click point for detail, scroll to detail cards below. See interaction/scroll-driven.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotion Curve × Scroll-driven</title>
<style>
  :root { --bg: #f5f5f5; --card: #fff; --border: #d0d0d0; --muted: #999; --text: #444; --line: #aaa; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 12px/1.5 ui-monospace, SFMono-Regular, monospace; background: var(--bg); color: var(--text); padding: 16px; }
  h1 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .chart-area { border: 1px solid var(--border); background: var(--card); padding: 16px 12px 8px; margin-bottom: 16px; }
  .chart-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  /* SVG emotion curve: valley shape (up, down, up) -->  */
  svg { display: block; }
  .axis-label { font-size: 9px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, monospace; }
  /* <!-- click a point on the curve to scroll to its detail card below --> */
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .detail-cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .detail-card { border: 1px solid var(--border); background: var(--card); padding: 10px; width: 150px; }
  .detail-title { font-weight: 600; font-size: 11px; margin-bottom: 4px; }
  .detail-desc { font-size: 10px; color: var(--muted); }
  .detail-emotion { font-size: 10px; color: var(--muted); margin-top: 4px; border-top: 1px dashed var(--border); padding-top: 4px; }
</style>
</head>
<body>
<h1>Emotion Curve &times; Scroll-driven</h1>

<div class="chart-area">
  <div class="chart-label">Emotion over journey steps</div>
  <svg width="100%" height="120" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet">
    <!-- Y-axis labels -->
    <text x="2" y="18" class="axis-label">+</text>
    <text x="2" y="65" class="axis-label">0</text>
    <text x="2" y="112" class="axis-label">-</text>
    <!-- Baseline -->
    <line x1="20" y1="60" x2="380" y2="60" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4"/>
    <!-- Emotion curve: valley shape -->
    <polyline points="40,30 110,40 180,95 250,100 320,45 380,25"
      fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <!-- Data points (click targets) -->
    <circle cx="40" cy="30" r="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="110" cy="40" r="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="180" cy="95" r="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="250" cy="100" r="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="320" cy="45" r="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="380" cy="25" r="4" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
    <!-- X-axis step labels -->
    <text x="40" y="118" class="axis-label" text-anchor="middle">S1</text>
    <text x="110" y="118" class="axis-label" text-anchor="middle">S2</text>
    <text x="180" y="118" class="axis-label" text-anchor="middle">S3</text>
    <text x="250" y="118" class="axis-label" text-anchor="middle">S4</text>
    <text x="320" y="118" class="axis-label" text-anchor="middle">S5</text>
    <text x="380" y="118" class="axis-label" text-anchor="middle">S6</text>
  </svg>
</div>

<h2>Detail Cards</h2>
<div class="detail-cards">
  <div class="detail-card">
    <div class="detail-title">S1 — Task 1</div>
    <div class="detail-desc">Placeholder detail.</div>
    <div class="detail-emotion">Emotion: positive</div>
  </div>
  <div class="detail-card">
    <div class="detail-title">S3 — Task 3</div>
    <div class="detail-desc">Placeholder detail.</div>
    <div class="detail-emotion">Emotion: negative</div>
  </div>
  <div class="detail-card">
    <div class="detail-title">S6 — Task 6</div>
    <div class="detail-desc">Placeholder detail.</div>
    <div class="detail-emotion">Emotion: positive</div>
  </div>
</div>
</body>
</html>
