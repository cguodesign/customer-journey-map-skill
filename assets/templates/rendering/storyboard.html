<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard rendering — reference template</title>
<!--
  STORYBOARD rendering (5th rendering mode). A film-storyboard layout: one frame per
  step, in a CUT / FRAME / ACTION / DIALOGUE / TIME table. Best for narrative journeys
  where the audience should move through the experience frame by frame (the visual
  cousin of the Storyline express format). Pairs with Scroll-driven or Focus+Context.

  DATA MAPPING (journey field → storyboard cell):
    cut      ← step index / id            FRAME wash ← emotionValence (or inferred from `emotion`)
    scene    ← short paraphrase of `description` / `touchpoint` / setting (the "shot")
    glyph    ← a stock line-art icon chosen from channel/doing/emotion (screen, mail, lock, clock, fork, void, star…)
    pers     ← `persona` names → initial chips
    action   ← `description` + `doing`
    q        ← `thinking` (rendered as the character's dialogue)
    note     ← `painPoint` / `failureMode` / `opportunity`
    emo      ← `emotion` label
    time     ← `duration` / `waitTime`
    mot/fail ← `momentOfTruth` → ★ marker · `failureMode` present → ⚠ marker
  Markers are semantic & fixed (red ★ moment of truth, dark-yellow ⚠ failure), per the color guide.
  Replace the placeholder `board` array below with the journey's steps. Insert {m:'…'} rows for milestone bands.
-->
<style>
/* tokens:begin */
/* ============================================================================
   journey-tokens.css — the single source of truth for every journey rendering.

   Tier 1  brand seed      ~10 values. The only thing a user/brand ever changes.
   Tier 2  semantic        derived from Tier 1. Renderings consume THESE.
   Tier 3  component       declared locally inside each rendering, from Tier 2.

   Rule for renderings: zero literal colors. If you type a hex, it belongs here.
   Themes: base = light. Dark re-derives (never inverts) via prefers-color-scheme
   and [data-theme], so a manual toggle wins in both directions.

   OVERRIDING TIER 1 (brand themes, paper artifacts): the dark blocks below are
   selected by :root:not([data-theme="light"]) and :root[data-theme="dark"],
   both of which out-specify a bare :root. So an artifact that reseeds Tier 1
   must also pin its theme on the element:

       <html data-theme="light">   ← now the dark blocks cannot match, and a
                                     later :root{...} override wins on order

   Reseeding at :root without pinning a theme silently does nothing for readers
   whose system is set to dark. See renderings/food-delivery--swimlane-themed
   (a brand reseed) and renderings/job-application--storyboard (a paper reseed).
   ========================================================================= */

/* ── Tier 1 · brand seed ───────────────────────────────────────────────── */
:root{
  --brand-primary:    oklch(70% 0.148 52);      /* chrome, accent, selection   */
  --brand-secondary:  oklch(63% 0.115 248);     /* second categorical hue      */
  --brand-surface:    oklch(98.6% 0.006 80);    /* page ground                 */
  --brand-text:       oklch(21% 0.014 62);      /* body ink                    */
  --brand-positive:   oklch(64% 0.118 158);     /* semantic good               */
  --brand-negative:   oklch(58% 0.168 25);      /* semantic bad                */
  --brand-machine:    oklch(60% 0.096 285);     /* automated / no-human paths  */
  --brand-on-primary: oklch(22% 0.014 70);      /* text that sits ON the primary */
  --brand-attention:  oklch(72% 0.152 62);      /* momentOfTruth — NOT the brand:
                                                   a marker that repaints itself
                                                   when the logo changes is not a
                                                   marker (guide § colour) */
  /* categorical seed — Okabe-Ito, distinguishable under all three common
     colour-vision deficiencies. Independent of brand on purpose (see
     html-rendering-guide § accessibility); override only if the brand's own
     categorical palette has been checked for the same. */
  --brand-cat-1:      oklch(56% 0.108 248);     /* blue            */
  --brand-cat-2:      oklch(62% 0.155 42);      /* vermillion      */
  --brand-cat-3:      oklch(60% 0.098 168);     /* bluish green    */
  --brand-cat-4:      oklch(72% 0.145 78);      /* orange          */
  --brand-cat-5:      oklch(56% 0.112 340);     /* reddish purple  */
  --brand-font:       "Söhne","Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --brand-font-mono:  ui-monospace,"SF Mono","Berkeley Mono",Menlo,Consolas,monospace;
  --brand-radius:     3px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-primary:   oklch(76% 0.138 55);
    --brand-secondary: oklch(70% 0.105 248);
    --brand-surface:   oklch(17.5% 0.008 66);
    --brand-text:      oklch(94% 0.008 80);
    --brand-positive:  oklch(72% 0.108 158);
    --brand-negative:  oklch(67% 0.150 26);
    --brand-machine:   oklch(70% 0.088 285);
    --brand-attention: oklch(78% 0.140 64);
    --brand-cat-1:     oklch(70% 0.098 248);
    --brand-cat-2:     oklch(72% 0.140 42);
    --brand-cat-3:     oklch(70% 0.090 168);
    --brand-cat-4:     oklch(78% 0.130 78);
    --brand-cat-5:     oklch(68% 0.102 340);
  }
}
:root[data-theme="dark"]{
  --brand-primary:   oklch(76% 0.138 55);
  --brand-secondary: oklch(70% 0.105 248);
  --brand-surface:   oklch(17.5% 0.008 66);
  --brand-text:      oklch(94% 0.008 80);
  --brand-positive:  oklch(72% 0.108 158);
  --brand-negative:  oklch(67% 0.150 26);
  --brand-machine:   oklch(70% 0.088 285);
  --brand-attention: oklch(78% 0.140 64);
  --brand-cat-1:     oklch(70% 0.098 248);
  --brand-cat-2:     oklch(72% 0.140 42);
  --brand-cat-3:     oklch(70% 0.090 168);
  --brand-cat-4:     oklch(78% 0.130 78);
  --brand-cat-5:     oklch(68% 0.102 340);
}

/* ── Tier 2 · semantic ─────────────────────────────────────────────────── */
:root{
  /* ground & elevation — dark re-derives by mixing toward ink, not by inverting */
  --bg:          var(--brand-surface);
  --surface-1:   color-mix(in oklab, var(--brand-surface) 97%, var(--brand-text));
  --surface-2:   color-mix(in oklab, var(--brand-surface) 93%, var(--brand-text));
  --surface-3:   color-mix(in oklab, var(--brand-surface) 88%, var(--brand-text));

  /* ink */
  --ink:         var(--brand-text);
  --ink-muted:   color-mix(in oklab, var(--brand-text) 58%, var(--brand-surface));
  --ink-faint:   color-mix(in oklab, var(--brand-text) 36%, var(--brand-surface));
  --ink-ghost:   color-mix(in oklab, var(--brand-text) 20%, var(--brand-surface));

  /* rules */
  --line:        color-mix(in oklab, var(--brand-text) 16%, var(--brand-surface));
  --line-soft:   color-mix(in oklab, var(--brand-text) 9%,  var(--brand-surface));
  --line-strong: color-mix(in oklab, var(--brand-text) 34%, var(--brand-surface));

  /* accent */
  --accent:       var(--brand-primary);
  --accent-soft:  color-mix(in oklab, var(--brand-primary) 16%, var(--brand-surface));
  --accent-line:  color-mix(in oklab, var(--brand-primary) 55%, var(--brand-surface));
  --accent-ink:   color-mix(in oklab, var(--brand-primary) 18%, var(--brand-text));
  --ink-on-accent: var(--brand-on-primary);

  /* emotion valence — diverging, 5 stops. Deliberately held one step back from
     full strength: valence is the *field*, markers are annotations laid on top of
     it, and a marker that reads as just another data point has failed. NEVER the
     sole encoding either — always pair with position, a numeral, or a glyph
     (see html-rendering-guide § accessibility). */
  --valence-n2:  color-mix(in oklab, var(--brand-negative) 82%, var(--surface-2));
  --valence-n1:  color-mix(in oklab, var(--brand-negative) 52%, var(--surface-2));
  --valence-0:   var(--ink-ghost);
  --valence-p1:  color-mix(in oklab, var(--brand-positive) 52%, var(--surface-2));
  --valence-p2:  color-mix(in oklab, var(--brand-positive) 82%, var(--surface-2));

  /* markers */
  --marker-critical:    var(--brand-attention);   /* momentOfTruth   */
  --marker-fail:        var(--brand-negative);    /* failureMode     */
  --marker-opportunity: var(--brand-positive);    /* opportunity     */
  --marker-machine:     var(--brand-machine);     /* automation      */
  --marker-pain:        color-mix(in oklab, var(--brand-negative) 62%, var(--brand-primary)); /* painPoint */

  /* Two colours that pair with *data*, not with the page, so they must NOT flip
     with the theme: text sitting on a saturated fill, and the colour a shadow is
     cast in. Inverting either is the classic dark-mode bug. */
  --ink-on-fill: oklch(22% 0.014 70);
  --shadow-ink:  oklch(12% 0.010 60);

  /* actor kinds (categorical — limit to 4, per the guide's 6–8 hue ceiling) */
  --actor-primary:   var(--brand-primary);
  --actor-system:    var(--brand-machine);
  --actor-backstage: var(--brand-secondary);
  --actor-none:      var(--ink-faint);

  /* categorical — unordered groups: milestones, lanes, channels. Never use
     these for anything ordered; lightness (the ramp below) encodes magnitude. */
  --cat-1: var(--brand-cat-1);
  --cat-2: var(--brand-cat-2);
  --cat-3: var(--brand-cat-3);
  --cat-4: var(--brand-cat-4);
  --cat-5: var(--brand-cat-5);
  --cat-1-soft: color-mix(in oklab, var(--brand-cat-1) 16%, var(--bg));
  --cat-2-soft: color-mix(in oklab, var(--brand-cat-2) 16%, var(--bg));
  --cat-3-soft: color-mix(in oklab, var(--brand-cat-3) 16%, var(--bg));
  --cat-4-soft: color-mix(in oklab, var(--brand-cat-4) 16%, var(--bg));
  --cat-5-soft: color-mix(in oklab, var(--brand-cat-5) 16%, var(--bg));

  /* service layers */
  --layer-customer-bg:  color-mix(in oklab, var(--brand-primary) 9%, var(--bg));
  --layer-customer-ln:  var(--accent-line);
  --layer-backstage-bg: var(--surface-2);
  --layer-backstage-ln: var(--line);
  --layer-support-bg:   var(--surface-1);
  --layer-support-ln:   var(--line-soft);

  /* sequential ramp — ordered magnitude (density, duration, count). Single hue,
     stepped in oklab so equal numeric steps read as equal perceptual steps. */
  --ramp-0: var(--surface-1);
  --ramp-1: color-mix(in oklab, var(--brand-primary) 18%, var(--surface-1));
  --ramp-2: color-mix(in oklab, var(--brand-primary) 36%, var(--surface-1));
  --ramp-3: color-mix(in oklab, var(--brand-primary) 56%, var(--surface-1));
  --ramp-4: color-mix(in oklab, var(--brand-primary) 78%, var(--surface-1));
  --ramp-5: var(--brand-primary);

  /* provenance — the skill's own metadata, so it gets first-class tokens */
  --prov-model:  var(--ink-ghost);                /* model-authored (default)  */
  --prov-user:   var(--brand-primary);            /* user-modified             */
  --prov-source: var(--brand-secondary);          /* source-backed             */
  --prov-auto:   var(--brand-machine);            /* auto-composite            */

  /* priority */
  --prio-must:   var(--brand-negative);
  --prio-should: var(--brand-primary);
  --prio-nice:   var(--ink-faint);

  /* type — fluid modular scale, ratio 1.2 */
  --font:      var(--brand-font);
  --font-mono: var(--brand-font-mono);
  --step--2: clamp(0.60rem, 0.58rem + 0.10vw, 0.66rem);
  --step--1: clamp(0.72rem, 0.69rem + 0.14vw, 0.80rem);
  --step-0:  clamp(0.86rem, 0.82rem + 0.18vw, 0.95rem);
  --step-1:  clamp(1.03rem, 0.97rem + 0.28vw, 1.19rem);
  --step-2:  clamp(1.24rem, 1.14rem + 0.48vw, 1.55rem);
  --step-3:  clamp(1.60rem, 1.40rem + 1.00vw, 2.40rem);
  --step-4:  clamp(2.10rem, 1.70rem + 2.00vw, 4.00rem);

  /* space — deliberately uneven, so rhythm is possible */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 13px; --sp-4: 21px;
  --sp-5: 34px; --sp-6: 55px; --sp-7: 89px;

  --radius: var(--brand-radius);
  --dur-fast: 140ms; --dur: 260ms; --dur-slow: 620ms;
  --ease: cubic-bezier(.22,.61,.36,1);          /* ease-out-quart, no bounce */
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
}
/* tokens:end */

  :root{
    --ink: var(--ink);
    --rule: var(--line);
    --muted: var(--ink-muted);
    --v-2: var(--valence-n2);
    --v-1: var(--valence-n1);
    --v0: var(--valence-0);
    --vp1: var(--valence-p1);
    --vp2: var(--valence-p2);
    --frame-bg: var(--surface-1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-3);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;line-height:1.4;padding:28px 16px}
  .sheet{max-width:1040px;margin:0 auto;background:var(--bg);border:1.5px solid var(--ink);box-shadow:0 10px 40px color-mix(in oklab, var(--ink) 10%, transparent)}
  header.top{display:flex;justify-content:space-between;align-items:baseline;padding:18px 22px 12px;border-bottom:1.5px solid var(--ink);gap:16px;flex-wrap:wrap}
  header.top .ttl{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
  header.top .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .colhead,.row{display:grid;grid-template-columns:46px 280px 1fr 1fr 64px}
  .colhead{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--ink)}
  .colhead>div{padding:8px 12px;border-right:1px dotted var(--rule);text-align:center}
  .colhead>div:last-child{border-right:0}
  .row{border-bottom:1.5px solid var(--ink);min-height:150px}
  .row>div{border-right:1px dotted var(--rule);padding:12px}
  .row>div:last-child{border-right:0}
  .cut{font-weight:700;font-size:15px;text-align:center}
  .frame{position:relative;aspect-ratio:16/9;border:1px solid var(--ink);background:var(--frame-bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .frame .scope{position:absolute;left:6px;top:5px;font-size:8px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .frame .wash{position:absolute;inset:0;opacity:.5}
  .frame svg{position:relative;width:46%;height:46%;stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .frame .cap{position:absolute;left:0;right:0;bottom:0;background:color-mix(in oklab, var(--ink) 78%, transparent);color:var(--surface-2);font-size:9px;padding:4px 7px;line-height:1.3}
  .frame .pers{position:absolute;right:6px;top:5px;display:flex;gap:3px}
  .pers .chip{width:15px;height:15px;border-radius:50%;background:var(--ink);color:var(--surface-2);font-size:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--surface-2)}
  .marks{position:absolute;left:6px;bottom:24px;display:flex;gap:4px}
  .mk{font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border:1px solid;border-radius:2px;background:color-mix(in oklab, var(--bg) 90%, transparent)}
  .mk.mot{color:var(--marker-fail);border-color:var(--marker-fail)}.mk.fail{color:var(--marker-critical);border-color:var(--marker-critical)}
  .action{font-size:12px}.action .ph{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
  .dlg{font-size:12px}.dlg .q{font-style:italic;margin:0 0 8px;border-left:2px solid var(--ink);padding-left:8px}
  .dlg .note{font-size:11px;color:var(--muted);margin:0 0 6px}.dlg .emo{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .time{font-weight:700;font-size:12px;text-align:center}.time small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;margin-top:4px;font-weight:400}
  .mstone{background:var(--ink);color:var(--bg);font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:6px 14px}
  @media (max-width:720px){.colhead{display:none}.row{grid-template-columns:1fr;min-height:0}.row>div{border-right:0;border-bottom:1px dotted var(--rule)}.frame{max-width:320px}}
</style>
</head>
<body>
<div class="sheet">
  <header class="top">
    <div class="ttl">JOURNEY TITLE — Storyboard</div>
    <div class="meta">Persona: NAME · Storyboard · Page 1</div>
  </header>
  <div class="colhead"><div>Cut</div><div>Frame</div><div>Action</div><div>Dialogue / Notes</div><div>Time</div></div>
  <div id="board"></div>
</div>
<script>
// Stock line-art glyphs — pick one per step from its channel/doing/emotion.
const G = {
  screen:'<svg viewBox="0 0 100 100"><rect x="18" y="22" width="64" height="44" rx="3"/><line x1="40" y1="78" x2="60" y2="78"/><line x1="50" y1="66" x2="50" y2="78"/></svg>',
  mail:'<svg viewBox="0 0 100 100"><rect x="22" y="30" width="56" height="40" rx="3"/><path d="M22 34l28 22 28-22"/></svg>',
  lock:'<svg viewBox="0 0 100 100"><rect x="30" y="46" width="40" height="34" rx="4"/><path d="M38 46v-8a12 12 0 0 1 24 0v8"/></svg>',
  clock:'<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="28"/><line x1="50" y1="52" x2="50" y2="34"/><line x1="50" y1="52" x2="64" y2="58"/></svg>',
  fork:'<svg viewBox="0 0 100 100"><path d="M50 22v22"/><path d="M50 44 32 70"/><path d="M50 44 68 70"/></svg>',
  star:'<svg viewBox="0 0 100 100"><path d="M50 22l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z"/></svg>',
  // …add: doc, form, send, refresh, void — see the gallery example for the full set.
};
const VAL = {'-2':'var(--v-2)','-1':'var(--v-1)','0':'var(--v0)','1':'var(--vp1)','2':'var(--vp2)'};
const initials = n => n.split(/[\s-]/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

// PLACEHOLDER DATA — replace with the journey's steps (one object per step; {m:'…'} = milestone band).
const board = [
  {m:'Milestone One'},
  {cut:'1.1',g:'screen',v:1,pers:['Persona'],scene:'Opening shot — describe the setting',
   action:'What happens at this step (description + doing).',
   q:"The character's inner line (from `thinking`).",emo:'Emotion label',time:'—'},
  {cut:'1.2',g:'lock',v:-1,pers:['Persona','System'],scene:'A friction beat',fail:1,
   action:'Where it breaks.',note:'Pain point / failure mode (from the step).',emo:'Frustration',time:'~5m'},
  {m:'Milestone Two'},
  {cut:'2.1',g:'clock',v:-2,pers:['Persona'],scene:'The low point',mot:1,fail:1,
   action:'The make-or-break moment.',q:'The line the audience should feel.',
   note:'Why this is the moment of truth.',emo:'Resignation',time:'Weeks+'},
  {cut:'2.2',g:'star',v:2,pers:['Persona'],scene:'Resolution',
   action:'How it ends, when it ends well.',emo:'Relief',time:'—'},
];

const el = document.getElementById('board');
board.forEach(s=>{
  if(s.m){const d=document.createElement('div');d.className='mstone';d.textContent='Milestone — '+s.m;el.appendChild(d);return;}
  const row=document.createElement('div');row.className='row';
  const marks=[s.mot?'<span class="mk mot">★ moment of truth</span>':'',s.fail?'<span class="mk fail">⚠ failure</span>':''].join('');
  const pers=(s.pers||[]).map(p=>`<span class="chip" title="${p}">${initials(p)}</span>`).join('');
  row.innerHTML=`<div class="cut">${s.cut}</div>
   <div><div class="frame"><span class="scope">2.39:1 — SCOPE</span>
     <span class="wash" style="background:${VAL[String(s.v)]}"></span>
     <span class="pers">${pers}</span>${G[s.g]||''}
     <div class="marks">${marks}</div><div class="cap">${s.scene}</div></div></div>
   <div class="action"><p class="ph">Action</p>${s.action}</div>
   <div class="dlg">${s.q?`<p class="q">"${s.q}"</p>`:''}${s.note?`<p class="note">${s.note}</p>`:''}<p class="emo">${s.emo||''}</p></div>
   <div class="time">${s.time||'—'}<small>time</small></div>`;
  el.appendChild(row);
});
</script>
</body>
</html>
