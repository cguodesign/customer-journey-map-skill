<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Blueprint — Swimlane Scroll</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --lane-customer-bg: #fff9e6;
  --lane-customer-border: #c9a227;
  --lane-frontstage-bg: #fff9e6;
  --lane-frontstage-border: #c9a227;
  --lane-backstage-bg: #ffffff;
  --lane-backstage-border: #aaaaaa;
  --lane-support-bg: #f3f3f3;
  --lane-support-border: #999999;
  --marker-mot: #ef4444;
  --marker-failure: #8b6914;
  --divider-color: #888;
  --pill-bg: #f0f0f0;
  --pill-active: #2563eb;
  --pill-text: #333;
  --drawer-bg: #fafafa;
  --focus-ring: #2563eb;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

html, body {
  font-family: var(--font);
  background: #f8f8f8;
  color: #222;
  height: 100%;
  overflow: hidden;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  padding: 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: #111;
}

.persona-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.persona-filter label {
  color: #555;
  font-weight: 500;
}

.persona-filter select {
  font-size: 13px;
  padding: 4px 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
}

/* Phase pills */
.phase-nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0;
}

.phase-pill {
  flex-shrink: 0;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 16px;
  background: var(--pill-bg);
  color: var(--pill-text);
  border: 1px solid #ddd;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}

.phase-pill:hover {
  background: #e2e8f0;
}

.phase-pill.active {
  background: var(--pill-active);
  color: #fff;
  border-color: var(--pill-active);
}

/* Main container */
.main-container {
  display: flex;
  height: calc(100vh - 100px);
  overflow: hidden;
  position: relative;
}

/* Lane labels (sticky left) */
.lane-labels {
  position: sticky;
  left: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  width: 160px;
  min-width: 160px;
  background: #fff;
  border-right: 1px solid #e0e0e0;
}

.lane-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
  border-bottom: 1px solid #eee;
}

.lane-label:hover {
  background: #f5f5f5;
}

.lane-label .toggle-icon {
  font-size: 10px;
  color: #999;
  transition: transform 0.2s;
}

.lane-label.collapsed .toggle-icon {
  transform: rotate(-90deg);
}

.lane-label-text {
  flex: 1;
}

.lane-label-divider {
  font-size: 10px;
  font-style: italic;
  color: #888;
  padding: 0 12px;
  height: 24px;
  display: flex;
  align-items: center;
  border-bottom: none;
  background: #fafafa;
}

/* Scroll area */
.scroll-area {
  flex: 1;
  overflow-x: auto;
  overflow-y: auto;
  position: relative;
}

.scroll-content {
  display: flex;
  flex-direction: column;
  min-width: max-content;
}

/* Phase columns header row */
.phase-headers {
  display: flex;
  position: sticky;
  top: 0;
  z-index: 30;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
}

.phase-header {
  min-width: 260px;
  width: 260px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  text-align: center;
  border-right: 1px solid #eee;
}

.phase-header:last-child {
  border-right: none;
}

/* Grid body */
.grid-body {
  display: flex;
  flex-direction: column;
}

.lane-row {
  display: flex;
  flex-direction: column;
  transition: max-height 0.25s ease, opacity 0.2s ease;
  overflow: hidden;
}

.lane-row.collapsed .lane-cells {
  max-height: 0;
  opacity: 0;
  padding: 0;
  overflow: hidden;
}

.lane-cells {
  display: flex;
  max-height: 500px;
  opacity: 1;
  transition: max-height 0.25s ease, opacity 0.2s ease;
}

.lane-cell {
  min-width: 260px;
  width: 260px;
  padding: 12px 14px;
  border-right: 1px solid #eee;
  border-bottom: 1px solid #eee;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.lane-cell:last-child {
  border-right: none;
}

/* Lane backgrounds */
.lane-row[data-lane="customer"] .lane-cell {
  background: var(--lane-customer-bg);
}

.lane-row[data-lane="frontstage"] .lane-cell {
  background: var(--lane-frontstage-bg);
}

.lane-row[data-lane="backstage"] .lane-cell {
  background: var(--lane-backstage-bg);
}

.lane-row[data-lane="support"] .lane-cell {
  background: var(--lane-support-bg);
}

/* Divider rows */
.divider-row {
  display: flex;
  position: relative;
  height: 24px;
}

.divider-row::before {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 10px;
  font-style: italic;
  color: #888;
  background: #f8f8f8;
  padding: 0 8px;
  z-index: 2;
  white-space: nowrap;
}

.divider-row::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  border-top: 1.5px dashed var(--divider-color);
  z-index: 1;
}

/* Action box */
.action-box {
  position: relative;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.4;
  color: #333;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
  outline: none;
}

.action-box:hover {
  border-color: #aaa;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.action-box:focus-visible {
  border-color: var(--focus-ring);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
}

.action-box.selected {
  border-color: var(--focus-ring);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15), 0 2px 8px rgba(0,0,0,0.06);
}

.action-box.dimmed {
  opacity: 0.35;
}

/* Markers */
.marker-mot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--marker-mot);
}

.marker-failure {
  position: absolute;
  top: 5px;
  left: 5px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--marker-failure);
}

/* Phase arrow */
.phase-arrow {
  position: absolute;
  right: -14px;
  top: 50%;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 8px solid #bbb;
  z-index: 5;
}

.lane-cell:last-child .phase-arrow {
  display: none;
}

/* Detail drawer */
.detail-drawer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--drawer-bg);
  border-top: 1px solid #ddd;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 200;
  transform: translateY(100%);
  transition: transform 0.25s ease;
  max-height: 40vh;
  overflow-y: auto;
}

.detail-drawer.open {
  transform: translateY(0);
}

.drawer-content {
  padding: 20px 28px;
  max-width: 900px;
}

.drawer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}

.drawer-title {
  font-size: 15px;
  font-weight: 600;
  color: #111;
}

.drawer-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #666;
  padding: 0 4px;
  line-height: 1;
}

.drawer-close:hover {
  color: #111;
}

.drawer-meta {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.drawer-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: #e8e8e8;
  color: #555;
  font-weight: 500;
}

.drawer-tag.mot {
  background: #fecaca;
  color: #991b1b;
}

.drawer-tag.failure {
  background: #fef3c7;
  color: #92400e;
}

.drawer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.drawer-field {
  font-size: 12px;
}

.drawer-field-label {
  font-weight: 600;
  color: #666;
  margin-bottom: 3px;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.5px;
}

.drawer-field-value {
  color: #333;
  line-height: 1.5;
}

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 11px;
  color: #666;
  margin-left: auto;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.legend-dot.mot { background: var(--marker-mot); }
.legend-dot.failure { background: var(--marker-failure); }

/* Keyboard hints */
.kbd-hint {
  position: fixed;
  bottom: 12px;
  right: 16px;
  font-size: 10px;
  color: #999;
  z-index: 50;
  pointer-events: none;
}

.kbd-hint.drawer-open {
  bottom: calc(40vh + 12px);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1 id="title"></h1>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot mot"></span> Moment of Truth</div>
      <div class="legend-item"><span class="legend-dot failure"></span> Failure Point</div>
    </div>
    <div class="persona-filter">
      <label for="persona-select">Persona:</label>
      <select id="persona-select"><option value="all">All</option></select>
    </div>
  </div>
  <div class="phase-nav" id="phase-nav"></div>
</div>

<div class="main-container">
  <div class="lane-labels" id="lane-labels"></div>
  <div class="scroll-area" id="scroll-area">
    <div class="scroll-content" id="scroll-content"></div>
  </div>
</div>

<div class="detail-drawer" id="detail-drawer">
  <div class="drawer-content" id="drawer-content"></div>
</div>

<div class="kbd-hint" id="kbd-hint">Arrow keys to navigate boxes &middot; Esc to close</div>

<script>
const journeyData = {
  title: "New User Onboarding — Service Blueprint",
  personas: ["Alex (new user)", "Admin (team lead)"],
  milestones: [
    {
      id: "awareness",
      title: "Awareness & Sign-up",
      steps: [
        {
          id: "discover-product",
          description: "Discovers product through recommendation",
          customerAction: "Reads about product, visits website",
          frontstage: "Landing page with value proposition",
          backstage: "SEO/SEM campaigns, referral tracking",
          supportProcess: "Analytics platform, CMS",
          persona: "Alex (new user)",
          momentOfTruth: true
        },
        {
          id: "sign-up",
          description: "Creates account",
          customerAction: "Fills registration form, verifies email",
          frontstage: "Sign-up form, verification email",
          backstage: "Account provisioning, welcome email generation",
          supportProcess: "Auth service, email delivery, database",
          persona: "Alex (new user)"
        }
      ]
    },
    {
      id: "activation",
      title: "Activation",
      steps: [
        {
          id: "empty-workspace",
          description: "Encounters empty workspace",
          customerAction: "Looks for guidance, feels lost",
          frontstage: "Empty state UI (no onboarding wizard)",
          backstage: "Workspace initialization, default settings applied",
          supportProcess: "Provisioning service, feature flag system",
          persona: "Alex (new user)",
          failureMode: "User abandons — no clear next step"
        },
        {
          id: "first-project",
          description: "Creates first project through trial and error",
          customerAction: "Clicks around, eventually finds create button",
          frontstage: "Project creation dialog",
          backstage: "Project template engine, permission setup",
          supportProcess: "Storage service, project database",
          persona: "Alex (new user)"
        }
      ]
    },
    {
      id: "engagement",
      title: "Team Engagement",
      steps: [
        {
          id: "invite-team",
          description: "Invites team members",
          customerAction: "Enters colleague emails, sends invites",
          frontstage: "Invite dialog, personalized email preview",
          backstage: "Permission system, team workspace creation, notification dispatch",
          supportProcess: "Email service, SSO integration, billing system",
          persona: "Alex (new user)",
          momentOfTruth: true
        },
        {
          id: "team-onboard",
          description: "Team members join and orient",
          customerAction: "Accepts invite, explores shared workspace",
          frontstage: "Welcome screen, team activity feed",
          backstage: "Onboarding flow for invited users, activity tracking",
          supportProcess: "Notification service, activity database",
          persona: "Admin (team lead)"
        }
      ]
    },
    {
      id: "retention",
      title: "Value Realization",
      steps: [
        {
          id: "daily-use",
          description: "Team establishes daily workflow",
          customerAction: "Checks updates, assigns tasks, collaborates",
          frontstage: "Dashboard, notifications, task views",
          backstage: "Real-time sync, notification engine, search indexing",
          supportProcess: "WebSocket server, search infrastructure, CDN",
          persona: "Admin (team lead)"
        },
        {
          id: "hit-limit",
          description: "Reaches free tier limit",
          customerAction: "Tries to add 6th team member, gets blocked",
          frontstage: "Upgrade prompt with plan comparison",
          backstage: "Usage metering, plan enforcement, upgrade flow",
          supportProcess: "Billing system, payment gateway, CRM",
          persona: "Admin (team lead)",
          failureMode: "Team churns to competitor with better free tier"
        }
      ]
    }
  ]
};

// State
let selectedBox = null;
let drawerOpen = false;
let collapsedLanes = new Set();
let activePersona = "all";
let allBoxes = [];

const lanes = [
  { key: "customer", label: "Customer Actions", field: "customerAction" },
  { key: "frontstage", label: "Frontstage", field: "frontstage" },
  { key: "backstage", label: "Backstage", field: "backstage" },
  { key: "support", label: "Support Processes", field: "supportProcess" }
];

const dividers = [
  { after: "customer", label: "Line of Interaction" },
  { after: "frontstage", label: "Line of Visibility" },
  { after: "backstage", label: "Line of Internal Interaction" }
];

function init() {
  document.getElementById("title").textContent = journeyData.title;
  buildPersonaFilter();
  buildPhaseNav();
  buildLaneLabels();
  buildGrid();
  bindEvents();
}

function buildPersonaFilter() {
  const sel = document.getElementById("persona-select");
  journeyData.personas.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", (e) => {
    activePersona = e.target.value;
    applyPersonaFilter();
  });
}

function buildPhaseNav() {
  const nav = document.getElementById("phase-nav");
  journeyData.milestones.forEach((m, i) => {
    const pill = document.createElement("button");
    pill.className = "phase-pill" + (i === 0 ? " active" : "");
    pill.textContent = m.title;
    pill.dataset.index = i;
    pill.addEventListener("click", () => scrollToPhase(i));
    nav.appendChild(pill);
  });
}

function buildLaneLabels() {
  const container = document.getElementById("lane-labels");
  container.innerHTML = "";

  lanes.forEach((lane, i) => {
    const label = document.createElement("div");
    label.className = "lane-label" + (collapsedLanes.has(lane.key) ? " collapsed" : "");
    label.dataset.lane = lane.key;
    label.innerHTML = `<span class="lane-label-text">${lane.label}</span><span class="toggle-icon">▼</span>`;
    label.addEventListener("click", () => toggleLane(lane.key));
    container.appendChild(label);

    const divider = dividers.find(d => d.after === lane.key);
    if (divider) {
      const divEl = document.createElement("div");
      divEl.className = "lane-label-divider";
      divEl.textContent = divider.label;
      container.appendChild(divEl);
    }
  });
}

function buildGrid() {
  const scrollContent = document.getElementById("scroll-content");
  scrollContent.innerHTML = "";
  allBoxes = [];

  // Phase headers
  const headers = document.createElement("div");
  headers.className = "phase-headers";
  journeyData.milestones.forEach(m => {
    const h = document.createElement("div");
    h.className = "phase-header";
    h.textContent = m.title;
    headers.appendChild(h);
  });
  scrollContent.appendChild(headers);

  // Grid body
  const body = document.createElement("div");
  body.className = "grid-body";

  lanes.forEach((lane, laneIndex) => {
    const row = document.createElement("div");
    row.className = "lane-row" + (collapsedLanes.has(lane.key) ? " collapsed" : "");
    row.dataset.lane = lane.key;

    const cells = document.createElement("div");
    cells.className = "lane-cells";

    journeyData.milestones.forEach((milestone, mIndex) => {
      const cell = document.createElement("div");
      cell.className = "lane-cell";

      milestone.steps.forEach((step) => {
        const box = document.createElement("div");
        box.className = "action-box";
        box.tabIndex = 0;
        box.dataset.stepId = step.id;
        box.dataset.milestoneIndex = mIndex;
        box.dataset.laneIndex = laneIndex;
        box.dataset.persona = step.persona;
        box.textContent = step[lane.field] || "";

        if (step.momentOfTruth && lane.key === "customer") {
          const dot = document.createElement("span");
          dot.className = "marker-mot";
          dot.title = "Moment of Truth";
          box.appendChild(dot);
        }

        if (step.failureMode && lane.key === "customer") {
          const dot = document.createElement("span");
          dot.className = "marker-failure";
          dot.title = "Failure Point";
          box.appendChild(dot);
        }

        box.addEventListener("click", () => selectBox(box, step));
        allBoxes.push({ el: box, step, lane: lane.key, milestoneIndex: mIndex, laneIndex });
        cell.appendChild(box);
      });

      // Arrow between phases (except last)
      if (mIndex < journeyData.milestones.length - 1) {
        const arrow = document.createElement("span");
        arrow.className = "phase-arrow";
        cell.appendChild(arrow);
      }

      cells.appendChild(cell);
    });

    row.appendChild(cells);
    body.appendChild(row);

    // Divider
    const divider = dividers.find(d => d.after === lane.key);
    if (divider) {
      const divRow = document.createElement("div");
      divRow.className = "divider-row";
      divRow.dataset.label = divider.label;
      body.appendChild(divRow);
    }
  });

  scrollContent.appendChild(body);
}

function toggleLane(key) {
  if (collapsedLanes.has(key)) {
    collapsedLanes.delete(key);
  } else {
    collapsedLanes.add(key);
  }

  // Update lane labels
  document.querySelectorAll(".lane-label").forEach(el => {
    if (el.dataset.lane === key) {
      el.classList.toggle("collapsed", collapsedLanes.has(key));
    }
  });

  // Update lane rows
  document.querySelectorAll(".lane-row").forEach(el => {
    if (el.dataset.lane === key) {
      el.classList.toggle("collapsed", collapsedLanes.has(key));
    }
  });
}

function scrollToPhase(index) {
  const cells = document.querySelectorAll(".phase-header");
  if (cells[index]) {
    cells[index].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
  }

  // Update pills
  document.querySelectorAll(".phase-pill").forEach((p, i) => {
    p.classList.toggle("active", i === index);
  });
}

function selectBox(boxEl, step) {
  // Deselect previous
  if (selectedBox) {
    selectedBox.classList.remove("selected");
  }

  selectedBox = boxEl;
  boxEl.classList.add("selected");
  boxEl.focus();
  openDrawer(step);
}

function openDrawer(step) {
  const drawer = document.getElementById("detail-drawer");
  const content = document.getElementById("drawer-content");

  let tags = `<span class="drawer-tag">${step.persona}</span>`;
  if (step.momentOfTruth) tags += `<span class="drawer-tag mot">Moment of Truth</span>`;
  if (step.failureMode) tags += `<span class="drawer-tag failure">Failure Point</span>`;

  content.innerHTML = `
    <div class="drawer-header">
      <div class="drawer-title">${step.description}</div>
      <button class="drawer-close" id="drawer-close">&times;</button>
    </div>
    <div class="drawer-meta">${tags}</div>
    <div class="drawer-grid">
      <div class="drawer-field">
        <div class="drawer-field-label">Customer Action</div>
        <div class="drawer-field-value">${step.customerAction}</div>
      </div>
      <div class="drawer-field">
        <div class="drawer-field-label">Frontstage</div>
        <div class="drawer-field-value">${step.frontstage}</div>
      </div>
      <div class="drawer-field">
        <div class="drawer-field-label">Backstage</div>
        <div class="drawer-field-value">${step.backstage}</div>
      </div>
      <div class="drawer-field">
        <div class="drawer-field-label">Support Process</div>
        <div class="drawer-field-value">${step.supportProcess}</div>
      </div>
      ${step.failureMode ? `<div class="drawer-field" style="grid-column: 1 / -1;">
        <div class="drawer-field-label">Failure Mode</div>
        <div class="drawer-field-value" style="color: #92400e;">${step.failureMode}</div>
      </div>` : ""}
    </div>
  `;

  drawer.classList.add("open");
  drawerOpen = true;
  document.getElementById("kbd-hint").classList.add("drawer-open");

  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
}

function closeDrawer() {
  document.getElementById("detail-drawer").classList.remove("open");
  drawerOpen = false;
  document.getElementById("kbd-hint").classList.remove("drawer-open");
  if (selectedBox) {
    selectedBox.classList.remove("selected");
    selectedBox = null;
  }
}

function applyPersonaFilter() {
  allBoxes.forEach(({ el, step }) => {
    if (activePersona === "all" || step.persona === activePersona) {
      el.classList.remove("dimmed");
    } else {
      el.classList.add("dimmed");
    }
  });
}

function bindEvents() {
  // Keyboard navigation
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (drawerOpen) closeDrawer();
      return;
    }

    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
      e.preventDefault();
      navigateBoxes(e.key);
    }
  });

  // Update phase pills on scroll
  const scrollArea = document.getElementById("scroll-area");
  scrollArea.addEventListener("scroll", () => {
    updateActivePill(scrollArea.scrollLeft);
  });
}

function navigateBoxes(direction) {
  if (allBoxes.length === 0) return;

  let currentIndex = -1;
  if (selectedBox) {
    currentIndex = allBoxes.findIndex(b => b.el === selectedBox);
  }

  if (currentIndex === -1) {
    // Select first visible box
    const first = allBoxes.find(b => !b.el.classList.contains("dimmed") && !collapsedLanes.has(b.lane));
    if (first) selectBox(first.el, first.step);
    return;
  }

  const current = allBoxes[currentIndex];
  let target = null;

  if (direction === "ArrowRight") {
    // Next box in same lane, next milestone
    target = allBoxes.find((b, i) => i > currentIndex && b.laneIndex === current.laneIndex && !collapsedLanes.has(b.lane));
  } else if (direction === "ArrowLeft") {
    // Previous box in same lane
    for (let i = currentIndex - 1; i >= 0; i--) {
      if (allBoxes[i].laneIndex === current.laneIndex && !collapsedLanes.has(allBoxes[i].lane)) {
        target = allBoxes[i];
        break;
      }
    }
  } else if (direction === "ArrowDown") {
    // Same milestone, next lane
    target = allBoxes.find((b, i) => i > currentIndex && b.milestoneIndex === current.milestoneIndex && b.laneIndex > current.laneIndex && !collapsedLanes.has(b.lane));
  } else if (direction === "ArrowUp") {
    // Same milestone, previous lane
    for (let i = currentIndex - 1; i >= 0; i--) {
      if (allBoxes[i].milestoneIndex === current.milestoneIndex && allBoxes[i].laneIndex < current.laneIndex && !collapsedLanes.has(allBoxes[i].lane)) {
        target = allBoxes[i];
        break;
      }
    }
  }

  if (target) {
    selectBox(target.el, target.step);
    target.el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }
}

function updateActivePill(scrollLeft) {
  const phaseWidth = 260;
  const activeIndex = Math.round(scrollLeft / phaseWidth);
  document.querySelectorAll(".phase-pill").forEach((p, i) => {
    p.classList.toggle("active", i === activeIndex);
  });
}

// Initialize
init();
</script>
